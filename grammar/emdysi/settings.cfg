;;; Settings for emdysi's grammar extensions, in the syntax of ACE's
;;; configuration files (read by crates/emdysi-parse/src/lib.rs).

;; Rules that apply only to the whole input.
spanning-only-rules := cl_disc-conj_c.

;; Root conditions counted as strict, tried after the configuration's
;; strict root (see roots.tdl).
strict-roots := root_strict_excl.
