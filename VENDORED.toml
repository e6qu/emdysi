# Registry of third-party and non-code material in this repository.
#
# Every file under grammar/, corpora/ and data/, and every data file
# compiled into a crate, belongs to exactly one entry here. Each entry
# records where the material comes from (upstream, exact version), under
# which license and whose copyright, how it was changed, and what it is
# used for. `VENDORED.sha256` pins the content of every listed file.
# `python3 scripts/check-vendored.py` verifies both (run in CI); after an
# intended change, run it with `--update` and review the diff.
#
# Fields:
#   paths        directories or files covered (repository-relative)
#   name         what it is
#   upstream     where it comes from ("this repository" for own material)
#   version      exact upstream version: commit hash, release or date
#   retrieved    date the copy was taken (YYYY-MM-DD)
#   license      SPDX identifier, or LicenseRef-* with the text in-tree
#   license_files  license text(s) shipped alongside, repository-relative
#   copyright    copyright holders as stated upstream
#   provenance   where the text/data itself originates, and why it is clean
#   modifications  what was changed relative to upstream ("none" if verbatim)
#   use          "shipped" (compiled into or loaded by the tool) or "test"
#   source_doc   the detailed SOURCE.md
#   ai_generated optional boolean; true if the text was produced by a
#                language model (machine-generated text corpora)
#   generator    required when ai_generated = true, optional otherwise:
#                the models (or people) that produced the text, with the
#                license or terms that apply to their output

