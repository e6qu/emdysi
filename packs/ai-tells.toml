[pack]
name = "ai-tells"
description = "Vocabulary and constructions that are over-represented in machine-written prose."

[[rule]]
id = "ai-tells.vocabulary"
kind = "words"
match = "lemma"
severity = "warning"
message = "'{match}' is over-used in machine-written prose; prefer a plainer word."
words = [
  "delve", "tapestry", "testament", "intricate", "showcase", "underscore",
  "pivotal", "realm", "meticulous", "meticulously", "seamless", "seamlessly",
  "multifaceted", "embark", "foster", "bolster", "vibrant", "harness",
  "synergy", "holistic", "transformative", "commendable", "noteworthy",
  "unwavering", "invaluable", "groundbreaking", "game-changer", "cutting-edge",
  "ever-evolving", "paramount", "elevate", "unleash", "empower", "resonate",
  "unparalleled", "nuanced", "palpable", "nestled", "ever-changing",
]

[[rule]]
id = "ai-tells.stock-phrases"
kind = "words"
match = "surface"
severity = "warning"
message = "Stock phrase '{match}'."
words = [
  "plays a crucial role", "plays a pivotal role", "a testament to",
  "every step of the way", "can't wait to see what you", "can’t wait to see what you",
  "part of our journey", "it's that easy", "it’s that easy", "it's that simple",
  "it’s that simple", "and just like that", "your unique needs", "take the next step",
  "well on your way", "rest assured", "happy coding", "happy learning",
  "in today's fast-paced world", "in today’s fast-paced world",
  "navigate the complexities", "rich tapestry", "shed light on",
  "deep dive", "dive into", "at the end of the day", "stands as a",
  "serves as a reminder", "the ever-evolving landscape",
  "paradigm shift", "in a world where", "in a world of", "digital landscape",
  "unlock the full potential", "unlock new possibilities",
  "limitless possibilities", "endless possibilities", "lasting impact",
  "navigate the complexities of",
  "the real magic happens", "make or break", "hiding in plain sight",
  "has you covered", "will thank you", "this is just the beginning",
  "we can't wait to", "we can’t wait to", "every single time",
  "game changer", "supercharge", "the gift of focus",
  "paves the way for", "a pivotal moment", "uniquely positioned",
  "real, lasting value", "a meaningful step toward", "important implications for",
  "at the heart of everything we do", "whatever life throws at", "never look back",
  "does it all", "and then some", "truly magical", "guaranteed to impress",
  "brings people together", "it's no wonder", "it’s no wonder",
  "has something for everyone", "won't soon forget", "won’t soon forget",
  "a feast for the eyes", "hidden gem", "a must-visit", "adventure awaits",
  "top of mind", "remarkable results", "worth your time", "above and beyond",
  "make a real impact", "fostering a culture of", "actionable insights",
  "data-driven decision-making",
]

[[rule]]
id = "ai-tells.in-todays"
kind = "regex"
severity = "warning"
message = "Stock opening '{match}': the setting every generated introduction starts from."
description = "'In today's fast-paced world', 'In today's data-driven world', 'In today's digital landscape': a scene-setting formula of generated prose (in 2 of the 36 machine-written samples, never in the 410,000 words of the edited corpora)."
source = "corpora/ai-current (docs/evaluation.md, Machine-written prose from current models)"
pattern = "(?i)\\bin today[’']s (?:[a-z-]+,? ){0,3}(?:world|landscape|age|era|economy|environment|market)\\b"
examples = ["In today's data-driven world, data skills matter.\n", "In today's fast-paced digital landscape, failures happen.\n"]
acceptable = ["In today's meeting we decided to ship.\n"]

[[rule]]
id = "ai-tells.signposting"
kind = "words"
match = "surface"
severity = "suggestion"
message = "Signposting ('{match}') adds words without content."
words = [
  "it is important to note", "it's important to note", "it’s important to note",
  "it is worth noting", "it's worth noting", "it’s worth noting",
  "in conclusion", "in summary", "to sum up", "let's explore", "let’s explore",
  "in this article", "as previously mentioned",
]

[[rule]]
id = "ai-tells.chatbot"
kind = "words"
match = "surface"
severity = "error"
message = "Conversational residue from a chat assistant: '{match}'."
words = [
  "i hope this helps", "as an ai", "as a language model", "great question",
  "certainly!", "i'd be happy to help", "i’d be happy to help",
  "feel free to ask", "let me know if you have any other questions",
  "let me break it down", "let me break this down", "i hope that helps",
  "absolutely!",
]
examples = ["Certainly! Here is the answer.\n", "Great question. The flag sets the limit.\n"]
acceptable = ["It certainly helps.\n"]

[[rule]]
id = "ai-tells.not-x-but-y"
kind = "regex"
severity = "suggestion"
message = "Contrast frame ('not X but Y'); state the point directly."
pattern = "(?i)\\b(?:not|isn't|isn’t|wasn't|wasn’t|aren't|aren’t)\\s+(?:just|only|merely|simply)?\\s*[^.;:!?]{1,60}?(?:(?:,|;)?\\s+|\\s*[—–]\\s*)(?:but|it's|it’s|it is)\\b"

[[rule]]
id = "ai-tells.participial-tail"
kind = "construction"
severity = "suggestion"
message = "Trailing participial clause ('{match}') often adds vague commentary."
rules = ["vp_sbrd-prd-prp_c"]

[[rule]]
id = "ai-tells.rule-of-three"
kind = "coordination"
severity = "suggestion"
min = 3
max = 3
message = "Three-part list ('{match}'); check that each item earns its place."

[[rule]]
id = "ai-tells.em-dash"
kind = "density"
severity = "suggestion"
chars = ["—"]
per = 100
max = 1.0
message = "Em dashes are dense here ({count} per {per} words; at most {max} suggested)."

[[rule]]
id = "ai-tells.setup"
kind = "words"
match = "surface"
severity = "warning"
message = "Setup phrase ('{match}') announces a point instead of making it."
description = "Rhetorical setups and false profundity typical of machine-written prose (Wikipedia, Signs of AI writing): a build-up to a reveal, a claim that something changes everything, a borrowed aphorism."
words = [
  "here's the thing", "here’s the thing", "the real question is",
  "the real question isn't", "the real question isn’t", "one thing is clear",
  "one thing is certain", "changes everything", "changed everything",
  "the future belongs to", "the only constant is", "let that sink in",
  "make no mistake", "the truth is", "the reality is", "and here's why",
  "and here’s why", "here's the kicker", "here’s the kicker",
]
examples = [
  "But here's the thing: most teams get this wrong.\n",
  "Ultimately, one thing is clear: the tools will improve.\n",
]
acceptable = [
  "Here is the configuration file.\n",
]

[[rule]]
id = "ai-tells.engagement"
kind = "regex"
severity = "warning"
message = "Engagement bait ('{match}'): a question to the reader with no answer expected."
description = "A closing question to the reader, as in social-media posts written by a model. Only a sentence that is the whole question (not dialogue in quotation marks)."
pattern = "(?i)^\\s*(?:what do you think|thoughts|agree|what(?:'|’)s your take|what would you add|who else (?:agrees|feels this way))\\?\\s*$"
examples = [
  "Leadership is about trust.\n\nWhat do you think?\n",
]
acceptable = [
  "“What do you think? It is excellent news,” said Lydia.\n",
]

[[rule]]
id = "ai-tells.reader-hooks"
kind = "words"
match = "surface"
severity = "warning"
message = "Hook aimed at the reader ('{match}'); get to the point."
description = "Phrases current chat models use to court the reader: a show of candour, an invitation to dive in, a guess at the reader's experience, a call to action. Each occurs at most once in the 410,000 words of the edited corpora (corpora/edited, corpora/edited-by-sa), and in most of the documents of corpora/ai-current. ('Let's dive in' is left out: the Rust book uses it.)"
words = [
  "let's be honest", "let’s be honest", "let's face it", "let’s face it",
  "sound familiar?", "you're not alone", "you’re not alone",
  "ready to get started?", "ready to see it in action?", "spoiler:",
  "what most guides won't tell you", "what most guides won’t tell you",
  "i see you.",
]
examples = [
  "Let's be honest: most teams don't have this problem.\n",
  "It's 2 a.m. and the alert fires. Sound familiar? You're not alone.\n",
]
acceptable = [
  "To be honest, the old release was faster.\n",
]

[[rule]]
id = "ai-tells.formulas"
kind = "words"
match = "surface"
severity = "suggestion"
message = "Formula ('{match}'); start with what you have to say."
description = "Openers and closers of letters, emails and reviews that model-written versions use by default. None occurs in the edited corpora, though these have no letters, so the evidence is weaker than for the other lists: people write them too, which is why this is only a suggestion."
words = [
  "i hope this email finds you well", "i hope this message finds you well",
  "i am writing to express my", "i would welcome the opportunity to",
  "i look forward to the possibility of", "please don't hesitate to",
  "please don’t hesitate to", "don't hesitate to reach out",
  "don’t hesitate to reach out", "feel free to push back", "pro tip:",
]
examples = [
  "Hi Taylor,\n\nI hope this email finds you well!\n",
]
acceptable = [
  "Hi Taylor,\n\nThe invoice is attached.\n",
]

[[rule]]
id = "ai-tells.whether-you"
kind = "regex"
severity = "suggestion"
message = "Opening that casts a wide net ('{match}'); say who this is for, or drop it."
description = "A sentence opening with 'Whether you're X or Y', the catch-all of model-written marketing and guides: 7 times in the 5,675 words of corpora/ai-current, once in the 410,000 words of the edited corpora."
pattern = "^\\W*Whether\\s+(?:you're|you’re|you\\s+are)\\b"
examples = [
  "Whether you're a startup or a global enterprise, Ledgerline scales with you.\n",
]
acceptable = [
  "Whether the cache is warm depends on the last run.\n",
]

[[rule]]
id = "ai-tells.listicle-title"
kind = "regex"
scope = "heading"
severity = "suggestion"
message = "Listicle title ('{match}'); name the subject instead."
description = "A heading that opens with a number and a promise ('7 Proven Strategies to ...', '5 Simple Ways'), the title of model-written listicles. Not in the edited corpora."
pattern = "^\\W*\\d+\\s+(?:Proven|Essential|Simple|Easy|Powerful|Practical|Smart|Effective|Surprising|Ways|Tips|Strategies|Reasons|Secrets|Mistakes|Habits|Hacks)\\b"
examples = [
  "# 7 Proven Strategies to Supercharge Your Team\n\nIt works.\n",
]
acceptable = [
  "# 3 Running the tests\n\nRun them.\n",
]

[[rule]]
id = "ai-tells.just-fragment"
kind = "sentence-pair"
severity = "suggestion"
message = "Reveal after a run of fragments ('{match}' then 'Just ...'); say what it does instead."
description = "A list of things gone, in fragments, then the payoff in two words: 'No more spreadsheets. No more manual matching. Just results.' Not once in the edited corpora."
pattern = "^\\W*No\\b[^.!?]{1,60}[.!?]\\W*$"
next = "^\\W*Just\\s+\\w+(?:\\s+\\w+)?[.!]\\W*$"
examples = [
  "No more spreadsheets. No more manual matching. Just results.\n",
]
acceptable = [
  "No changes are needed. Just run the installer again.\n",
]

[[rule]]
id = "ai-tells.emoji-heading"
kind = "regex"
scope = "heading"
severity = "suggestion"
message = "Emoji in a heading; let the words carry it."
description = "An emoji at the start of a heading or list item, a habit of model-written READMEs and newsletters: never at the start of a line in the edited corpora, though their blog posts use emoji in running text."
pattern = "^\\W*?[\\x{1F300}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B50}\\x{2705}]"
examples = [
  "# Tidepool\n\n## ✨ Features\n\nIt is fast.\n",
]
acceptable = [
  "# Release notes\n\nThe survey was positive. 🎉 Most people want more.\n",
]

[[rule]]
id = "ai-tells.emoji-list"
kind = "regex"
scope = "list-item"
severity = "suggestion"
message = "Emoji at the start of a list item; let the words carry it."
description = "As `ai-tells.emoji-heading`, for list items ('🚀 **Blazing fast:** ...')."
pattern = "^\\W*?[\\x{1F300}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B50}\\x{2705}]"
examples = [
  "Features:\n\n- 🚀 Blazing fast startup.\n- 🔒 Secure by default.\n",
]
acceptable = [
  "Features:\n\n- Fast startup.\n- Secure defaults.\n",
]

[[rule]]
id = "ai-tells.hashtags"
kind = "regex"
severity = "suggestion"
message = "A line of hashtags; they belong to a social-media post, not to prose."
description = "Two or more hashtags making up a whole line, as model-written social-media posts end. Not in the edited corpora."
pattern = "^\\s*(?:#[A-Za-z]\\w*\\s*){2,}$"
examples = [
  "Keep going.\n\n#Leadership #Growth #Resilience\n",
]
acceptable = [
  "Use the `#[derive(Debug)]` attribute.\n",
]

[[rule]]
id = "ai-tells.openers"
kind = "regex"
severity = "suggestion"
message = "Mechanical transition ('{match}'); connect the sentences by their content, or drop it."
description = "Sentence-initial connectives that machine-written text over-uses: in the samples of corpora/beemo, corpora/cheat and corpora/hh-rlhf, 'Moreover', 'Furthermore' and 'Additionally' open 6.4 sentences per 10,000 words against 0.9 in the edited corpora, and 'Ultimately', 'Overall' and 'Importantly' 6.3 against 0.17."
pattern = "^\\W*(?:Moreover|Furthermore|Additionally|Ultimately|Overall|Importantly|Notably)(?=,)"
examples = [
  "The tool is fast. Moreover, it is easy to use.\n",
]
acceptable = [
  "The tool is fast, and it is easy to use.\n",
]

[[rule]]
id = "ai-tells.inflated"
kind = "words"
match = "lemma"
severity = "suggestion"
message = "'{match}' is a word machine-written prose leans on; say what is meant."
description = "Words that inflate rather than inform, four to a hundred times more frequent in the machine-written samples (corpora/beemo, corpora/cheat, corpora/hh-rlhf) than in the edited corpora, per 10,000 words: crucial 2.7 against 0.27, embrace 1.6 against 0.20, leverage 1.8 against 0.40, enhance 5.5 against 0.30, optimal 1.9 against 0.02, truly 2.4 against 0.27, valuable 2.6 against 0.35, exciting 1.3 against 0.17, thrilled 0.9 against 0.02, revolutionary 0.7 against 0.02; stunning and breathtaking do not occur in the edited corpora. Robust (2.4 against 0.30) is left out: technical writing uses it in its literal sense."
words = [
  "crucial", "embrace", "leverage", "innovative", "exciting", "thrilled",
  "revolutionary", "stunning", "breathtaking", "enhance", "optimal", "truly",
  "valuable",
]
examples = [
  "It is crucial to leverage these tools.\n",
]
acceptable = [
  "It is important to use these tools.\n",
]

[[rule]]
id = "ai-tells.false-balance"
kind = "regex"
severity = "suggestion"
message = "Balanced both-sides frame ('{match}'); say which side the evidence supports."
description = "Every argument made into 'while there are challenges, there are also opportunities'."
pattern = "(?i)\\bwhile\\b[^.!?]{0,120}\\b(?:challenges|risks|concerns|drawbacks|opportunities|benefits|advantages)\\b[^.!?]{0,100}\\balso\\b"
examples = [
  "While these advances present exciting opportunities, they also raise crucial questions.\n",
]
acceptable = [
  "While the build runs, the tests also run.\n",
]

[[rule]]
id = "ai-tells.its-about"
kind = "sentence-pair"
severity = "suggestion"
message = "Contrast across two sentences ('{match}' then 'It's about ...'); state the point directly."
description = "The negative-then-positive frame split into two sentences: 'It's not about working harder. It's about working smarter.'"
pattern = "(?i)\\b\\w+?(?:\\s+not|n't|n’t)\\s+(?:just\\s+|only\\s+|merely\\s+|simply\\s+|really\\s+)?about\\b.*"
next = "(?i)^\\W*(?:it|this|that|they)(?:'s|’s|'re|’re|\\s+is|\\s+are)\\s+(?:about|really about|all about)\\b"
examples = [
  "Leadership isn't about control. It's about trust.\n",
]
acceptable = [
  "The article is not about Rust. It covers Go.\n",
]

[[rule]]
id = "ai-tells.not-just-then-is"
kind = "sentence-pair"
severity = "suggestion"
message = "Contrast across two sentences ('{match}' then 'It's ...'); state the point directly."
description = "The negative-then-positive frame without 'about': 'Rate limiting isn't just a nice-to-have. It's essential.' The negative says 'just', 'only', 'merely' or 'simply'. Not in the edited corpora."
pattern = "(?i)\\b(?:isn't|isn’t|aren't|aren’t|is not|are not|wasn't|wasn’t)\\s+(?:just|only|merely|simply)\\b.*"
next = "(?i)^\\W*(?:it|they|that|this)(?:'s|’s|'re|’re|\\s+is|\\s+are)\\b"
examples = [
  "Rate limiting isn't just a nice-to-have. It's essential at scale.\n",
]
acceptable = [
  "It isn't something to submit. It's a separate part of the instructions.\n",
]

[[rule]]
id = "ai-tells.not-then-punchline"
kind = "sentence-pair"
severity = "suggestion"
message = "Contrast across two sentences ending in a punchline ('{match}' then a short 'It's ...'); state the point directly."
description = "A negative sentence answered by a short reframing: 'Setbacks aren't the end of your story. They're the plot twist.' The second sentence has at most five words after 'It's' or 'They're'. Not in the edited corpora, whose such pairs go on longer ('It's a separate part of the instructions')."
pattern = "(?i)\\b(?:isn't|isn’t|aren't|aren’t|wasn't|wasn’t)\\b.*"
next = "^\\W*(?:It|They|That)(?:'s|’s|'re|’re)\\s+\\w+(?:\\s+\\w+){0,3}[.!]\\W*$"
examples = [
  "Setbacks aren't the end of your story. They're the plot twist.\n",
]
acceptable = [
  "It isn't something to submit. It's a separate part of the instructions.\n",
]

[[rule]]
id = "ai-tells.rhetorical-question"
kind = "sentence-pair"
severity = "suggestion"
message = "Rhetorical question answered at once ('{match}'); state the answer."
description = "A question of one to three words answered by the next sentence: 'The result? A complete paradigm shift.' Not in dialogue: a question that opens with a quotation mark is a character speaking."
pattern = "^(?:\\w+[\\s’']+){0,2}\\w+\\?\\W*$"
next = "."
examples = [
  "We rebuilt the pipeline. The result? A complete paradigm shift.\n",
]
acceptable = [
  "Why does the build fail? The linker cannot find the library, so add it to the path.\n\nDid it work?\n",
]

[[rule]]
id = "ai-tells.one-line-paragraphs"
kind = "structure"
check = "one-line-paragraphs"
max_words = 8
min = 3
share = 0.4
severity = "suggestion"
message = "One-line paragraph ({count} words); in a run of them, each line reads as a drumbeat. Join it to the paragraph it belongs to."
description = "Dramatic single-sentence paragraphs of at most eight words, when there are three or more and they make up at least two fifths of a document's paragraphs: the format of a model-written social-media post ('I was wrong.'). Captions, bold lines, dialogue and links do not count; on a simulation over the 654 edited documents of corpora/edited and corpora/edited-by-sa, none qualifies."
examples = [
  "I spent ten years thinking leadership was about having all the answers.\n\nI was wrong.\n\nLeadership is about trust.\n\nIt starts with listening.\n",
]
acceptable = [
  "The build takes ten minutes on a laptop and two on the build farm, which caches the dependencies.\n\nRun it with `make`.\n",
]

[[rule]]
id = "ai-tells.bold-lead-ins"
kind = "structure"
check = "bold-lead-ins"
min = 3
share = 0.6
severity = "suggestion"
message = "{count} of the {items} list items open with a bold label, the shape of model-written lists; keep the labels only where readers scan for them."
description = "List items that open with a bold label and a colon ('**Logs:** The detailed record...'), when at least three of a document's list items and at least three fifths of them do; reported once a document. In the machine-written samples of corpora/ai-current most list items open so; in the edited corpora, 36 of 2,348, and only one document (a Rust blog post listing project goals, 11 of 15) passes the threshold (a Kubernetes reference page with 7 of 13 does not)."
examples = [
  "The three pillars:\n\n- **Logs:** What happened.\n- **Metrics:** How it performs.\n- **Traces:** Where a request went.\n",
]
acceptable = [
  "The three pillars:\n\n- Logs record what happened.\n- Metrics show how it performs.\n- **Traces:** Where a request went.\n",
]

[[rule]]
id = "ai-tells.dense"
kind = "tell-density"
of = ["ai-tells.", "substance.filler", "substance.platitude", "substance.vacuous", "substance.aphorism"]
per = 100
max = 2.0
min = 5
severity = "warning"
message = "This text has {count} marks of machine-written prose in {words} words ({rate} per {per}); any one proves little, but together they make it read as generated."
description = "The density of the other ai-tells findings and of filler, platitudes, vacuous sentences and maxims: the constructions are common in human writing too, and what marks machine-written prose is several in a short passage (Wikipedia, Signs of AI writing)."
examples = [
  "In today's fast-paced world, here's the thing: it's not just a tool, it's a paradigm shift. Moreover, it is crucial to leverage these groundbreaking innovations. Ultimately, one thing is clear: the future belongs to those who embrace change.\n",
]
acceptable = [
  "The build takes ten minutes on a laptop and two on the build farm, which caches the dependencies. Run it with make, and check the log for warnings.\n",
]
