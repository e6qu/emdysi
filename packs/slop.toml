[[rule]]
id = "slop.em-dash"
kind = "regex"
severity = "warning"
message = "Em dash: A comma if the aside is light, a colon if what follows explains, brackets if it is a true aside, a full stop if it is really a second sentence."
description = "An em dash, or an en dash or double hyphen standing in for one. Every occurrence, no threshold. This is a house-style rule and it is not optional: the owner of a document that carries it does not want em dashes in it."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (em-dash); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "—|\\s–\\s|\\s--\\s|\\s—\\s"
examples = ["The migration took a week — longer than anyone expected.\n", "It shipped on a Tuesday – quietly, as these things do.\n", "The queue ran clean -- for four months at least.\n"]
acceptable = ["The study ran from 1990–1995 without a break.\n", "It is a well-known problem in the parser.\n", "Run it with --force to install anyway.\n"]

