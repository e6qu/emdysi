kind = "regex"
severity = "suggestion"
message = "“the actual X”: Name it without the emphasis."
description = "Emphatic “actual” used to signal that the real thing is finally being named. Measured at ×8.2 vs humans."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (the-actual); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bthe\\s+actual\\s+[\\w-]+\\b"
examples = ["The actual failure mode is subtler than that.\n"]
acceptable = ["Actual costs came in under budget.\n"]

[[rule]]
id = "slop.privilege-of"
kind = "regex"
severity = "suggestion"
message = "“the privilege of …”: Say what you did and with whom."
description = "Announced gratitude. Not observed in the human baseline at all. Measured at only in AI."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (privilege-of); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bthe\\s+privilege\\s+of\\s+\\w+ing\\b"
examples = ["I've had the privilege of working alongside talented people.\n"]
acceptable = ["Privilege escalation was the root cause.\n"]

[[rule]]
id = "slop.taught-me"
kind = "regex"
severity = "suggestion"
message = "“X taught me Y”: Report what happened and let the reader draw the lesson."
description = "The lesson-extraction move that converts an anecdote into a moral. Measured at only in AI."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (taught-me); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\btaught\\s+me\\s+(?:something|a\\s+lot|one\\s+thing|that|this)\\b"
examples = ["Closing those deals taught me something important.\n"]
acceptable = ["My teacher taught me French.\n"]

[[rule]]
id = "slop.the-lesson-q"
kind = "regex"
severity = "suggestion"
message = "“The lesson? …”: State the conclusion as a sentence."
description = "The rhetorical-question header that packages a conclusion. Measured at construct."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (the-lesson-q); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)(?:^|\\n|[.!?]\\s+)(?:\\*\\*)?The\\s+(?:real\\s+)?(?:lesson|takeaway|wins?|kicker|upshot)\\??(?:\\*\\*)?\\s*[?:]"
examples = ["The lesson? Ship earlier.\n", "The real wins? Built my own routine.\n"]
acceptable = ["The lesson plan covered three topics.\n"]

[[rule]]
id = "slop.youre-not-alone"
kind = "regex"
severity = "suggestion"
message = "“You're not alone”: Cut it. State the situation."
description = "Pre-emptive reassurance addressed to a reader who did not ask for it. Measured at only in AI."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (youre-not-alone); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\byou(?:['’]re|\\s+are)\\s+not\\s+(?:imagining\\s+it|crazy|alone)\\s*(?=[.,!?:;—–]|$)"
examples = ["You're not imagining it: hiring really has slowed.\n", "If the build feels slower, you're not alone.\n"]
acceptable = ["You are not alone in the building after six.\n"]

[[rule]]
id = "slop.not-x-but-y"
kind = "regex"
severity = "suggestion"
message = "“Not X but Y” (unqualified): Say what it is. The negated half is usually a straw man nobody proposed."
description = "The negation flip without a just/only/merely qualifier: “not a tool but a partner”. Slop Score weights this construction at 25% of its entire score, on its own, separate from word lists."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (not-x-but-y); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bnot\\s+(?:a|an|the|about|in|of|by|for|with|from)\\s+[^.!?\\n;]{2,50}?,?\\s+but\\s+(?:rather\\s+)?(?:a|an|the|about|in|of|by|for|with|from)\\b"
examples = ["It is not a tool but a partner.\n", "The problem is not about speed but about accuracy.\n", "This was not the end but the beginning.\n", "The fix came not from the compiler but from the linker.\n"]
acceptable = ["He did not know but she did.\n", "I am not sure but I will check.\n", "She did not buy the car but rented one instead.\n", "We are not in a hurry but we should start soon.\n"]

[[rule]]
id = "slop.extends-far-beyond"
kind = "regex"
severity = "suggestion"
message = "“Extends far beyond”: Say what it covers. “Far beyond” is doing the work a specific noun should do."
description = "Significance inflation. Seventeen variants of this construction appear in the essay-domain trigram list, making it the single most repeated shape there."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (extends-far-beyond); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:extend|extends|extended|extending|go|goes|going|went|reach|reaches|reaching|stretch|stretches|move|moves|moving)\\s+(?:far\\s+|well\\s+)?beyond\\s+(?:mere|simple|simply|simplistic|just|the\\s+surface|surface[- ]level)\\b|\\b(?:extend|extends|extended|extending|go|goes|going|went)\\s+far\\s+beyond\\b"
examples = ["The impact extends far beyond the engineering team.\n", "Its value goes beyond mere convenience.\n", "The consequences reach well beyond simple cost savings.\n", "We must move beyond simplistic explanations.\n"]
acceptable = ["The cable extends beyond the desk.\n", "The garden goes beyond the fence.\n", "Sales grew beyond our forecast.\n"]

[[rule]]
id = "slop.another-critical"
kind = "regex"
severity = "suggestion"
message = "“Another critical aspect”: Name the relationship. If the next point is a consequence, a caveat or a contrast, say which."
description = "The section-transition tic that stitches paragraphs together without saying how they relate."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (another-critical); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\banother\\s+(?:critical|crucial|key|important|significant|essential|vital)\\s+(?:aspect|component|factor|element|consideration|dimension|piece|part|area)\\b|\\banother\\s+layer\\s+of\\s+complexity\\b"
examples = ["Another critical aspect is monitoring.\n", "Another key factor is latency.\n", "This adds another layer of complexity.\n"]
acceptable = ["We shipped another critical fix on Friday.\n", "There is another aspect to consider.\n"]

[[rule]]
id = "slop.essay-announce"
kind = "regex"
severity = "suggestion"
message = "The essay announces itself: Delete the sentence and start with the argument. The reader can see what they are reading."
description = "Prose that opens by describing itself. Three inflections of “this essay explores” survive into the essay-domain trigram list."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (essay-announce); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bthis\\s+(?:essay|article|post|piece|paper|report|guide|section)\\s+(?:will\\s+)?(?:explores?|examines?|delves?|investigates?|discusses?|argues?|aims?\\s+to|seeks?\\s+to|sets?\\s+out\\s+to)\\b|\\bin\\s+this\\s+(?:essay|article|post|piece)\\s*,"
examples = ["This essay explores the causes of the collapse.\n", "This article will examine three approaches.\n", "In this post, we look at caching.\n", "This paper aims to establish a baseline.\n"]
acceptable = ["This essay is due Friday.\n", "The article explores a cave system.\n"]

[[rule]]
id = "slop.valuable-insights"
kind = "regex"
severity = "suggestion"
message = "“Provides valuable insights”: State the insight. If it will not fit in a sentence it was not one."
description = "Claiming the reader learned something instead of telling them what. Both halves recur across the essay trigram list."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (valuable-insights); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:provide|provides|provided|offer|offers|offered|yield|yields|give|gives|gain|gains|gaining|deliver|delivers)\\s+(?:us\\s+|you\\s+)?(?:a\\s+|some\\s+|valuable\\s+|useful\\s+|deeper\\s+|key\\s+|important\\s+)*insights?\\b|\\b(?:gain|gains|gaining|develop|develops)\\s+(?:a\\s+)?(?:deeper|better|richer|nuanced)\\s+understanding\\b"
examples = ["The survey provides valuable insights into churn.\n", "This offers insight into how the cache behaves.\n", "Readers gain a deeper understanding of the tradeoffs.\n"]
acceptable = ["Her insight was that the lock was held too long.\n", "He offered to help with the migration.\n"]

[[rule]]
id = "slop.multi-pronged"
kind = "regex"
severity = "suggestion"
message = "“Requires a multi-pronged approach”: List the prongs. If there are three, name them; if there is one, say so."
description = "The non-answer that concludes a problem statement by declining to pick anything."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (multi-pronged); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:requires?|demands?|needs?|calls?\\s+for|takes?|warrants?)\\s+(?:a\\s+|an\\s+)?(?:multi[- ]?(?:faceted|pronged|layered|dimensional)|holistic|comprehensive|nuanced|forward[- ]thinking|two[- ]pronged|three[- ]pronged)\\s+(?:approach|strategy|solution|response|effort|framework)\\b"
examples = ["Addressing this requires a multi-faceted approach.\n", "The problem demands a holistic strategy.\n", "It calls for a comprehensive response.\n"]
acceptable = ["The migration requires a database backup.\n", "This needs a second reviewer.\n"]

[[rule]]
id = "slop.turning-point"
kind = "regex"
severity = "suggestion"
message = "“Marked a significant turning point”: Say what changed and when. Let the reader decide whether it was a turning point."
description = "Retrospective grandeur applied to whatever the paragraph just described."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (turning-point); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bmark(?:s|ed|ing)?\\s+(?:a\\s+|an\\s+|the\\s+)?(?:significant|major|pivotal|critical|key|important|decisive|watershed)?\\s*(?:turning\\s+point|inflection\\s+point|pivotal\\s+moment|watershed\\s+moment|sea\\s+change)\\b|\\b(?:a|the)\\s+(?:significant|major|pivotal|critical|decisive|watershed)\\s+turning\\s+point\\b"
examples = ["The release marked a significant turning point for the project.\n", "2020 marked a pivotal moment in remote work.\n", "It was a watershed turning point.\n"]
acceptable = ["The road turns left at the point.\n", "Mark reviewed the deployment.\n"]

[[rule]]
id = "slop.closer-look"
kind = "regex"
severity = "suggestion"
message = "“A closer examination reveals”: Report the finding. The reader does not need to be told you looked closely."
description = "Teasing the finding in a clause before delivering it, which costs a sentence and adds nothing."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (closer-look); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:a\\s+)?(?:closer|deeper|more\\s+careful)\\s+(?:look|examination|inspection|analysis|reading)\\s+(?:at\\s+[^.!?\\n;]{1,40}\\s+)?reveals?\\b|\\bupon\\s+(?:closer|further)\\s+(?:examination|inspection|reflection)\\b"
examples = ["A closer examination reveals a second bottleneck.\n", "A deeper look at the logs reveals the retry storm.\n", "Upon closer inspection, the seal had failed.\n"]
acceptable = ["Take a closer look at line 40.\n", "The examination revealed nothing unusual.\n"]

[[rule]]
id = "slop.inextricably-linked"
kind = "regex"
severity = "suggestion"
message = "“Inextricably linked”: Say how they are linked, and in which direction."
description = "A high-register way of saying “related” that adds a syllable count instead of a claim."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (inextricably-linked); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:inextricably|intrinsically|inherently|fundamentally)\\s+(?:linked|tied|bound|connected|intertwined)\\b|\\b(?:deeply|closely|tightly)\\s+intertwined\\b"
examples = ["Pay and retention are inextricably linked.\n", "The two systems are deeply intertwined.\n"]
acceptable = ["The cables are linked at the junction box.\n", "The accounts are connected to one login.\n"]

[[rule]]
id = "slop.moral-uplift"
kind = "regex"
severity = "suggestion"
message = "Moral-uplift closers: Cut it, or name who has to do what."
description = "The uplift that closes a section without committing to anything: challenge the status quo, confront uncomfortable truths, foster a sense of belonging."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (moral-uplift); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:challenge|challenges|challenging|question|questions|disrupt|disrupts)\\s+the\\s+status\\s+quo\\b|\\bconfront(?:s|ed|ing)?\\s+(?:uncomfortable|hard|difficult|inconvenient)\\s+truths?\\b|\\bfoster(?:s|ed|ing)?\\s+a\\s+sense\\s+of\\s+(?:community|belonging|shared\\s+\\w+|purpose)\\b"
examples = ["We must challenge the status quo.\n", "The report confronts uncomfortable truths.\n", "Rituals foster a sense of belonging.\n"]
acceptable = ["The status quo held for a decade.\n", "The truth was simpler than that.\n"]

[[rule]]
id = "slop.each-a"
kind = "regex"
severity = "suggestion"
message = "“…, each a …” appositive cascade: End the sentence after the list, or say what each item actually does."
description = "The appositive flourish that turns a list into a cascade of significance. One of only three regexes the antislop sampler ships, alongside not-X-but-Y."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (each-a); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i),\\s+each\\s+(?:one\\s+)?an?\\s+\\w+(?:\\s+\\w+)?\\s+(?:to|into|of|in|for|toward|towards)\\b"
examples = ["Twelve panels, each a window into another world.\n", "Dozens of commits, each a step toward the rewrite.\n"]
acceptable = ["We reviewed the files, each a few hundred lines long.\n", "Give each a chance to finish.\n"]

[[rule]]
id = "slop.reveal-shape"
kind = "regex"
severity = "suggestion"
message = "Reveal-shape tell: State the thing directly instead of teasing it, and stop casting the reader as the one getting it wrong."
description = "The \"here's the hidden truth people get wrong\" framing, which survives rewording because it is a shape rather than a phrase."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (reveal-shape); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:what|the thing)\\s+(?:nobody|no\\s+one|most\\s+people|everyone)\\s+(?:tells?|knows?|gets?\\s+wrong|miss(?:es)?|overlooks?|talks?\\s+about|does)\\b"
examples = ["What nobody tells you is that the migration takes a week.\n", "This is what most people get wrong about caching.\n"]
acceptable = ["Nobody told us the deadline had moved.\n", "Most people prefer the shorter route.\n"]

[[rule]]
id = "slop.not-in-job-description"
kind = "regex"
severity = "suggestion"
message = "\"Not in the job description\": Say what the work actually was."
description = "The stock reveal that the real work is the unglamorous part."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (not-in-job-description); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:is|was)?\\s*n[o']?t\\s+in\\s+the\\s+job\\s+description\\b"
examples = ["Debugging the vendor's SDK was not in the job description.\n"]
acceptable = ["The job description listed three requirements.\n"]

[[rule]]
id = "slop.the-part-people-skip"
kind = "regex"
severity = "suggestion"
message = "\"The part people skip\": Name the detail."
description = "Gesturing at a neglected detail rather than stating it. Close cousin of the shipped `thats-the-part`."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (the-part-people-skip); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bthe\\s+part\\s+(?:that\\s+)?(?:people|everyone|most\\s+readers|nobody|no\\s+one)\\s+(?:skips?|misses?|overlooks?|ignores?)\\b"
examples = ["Here is the part everyone skips.\n"]
acceptable = ["The parts department closed at five.\n"]

[[rule]]
id = "slop.era-of"
kind = "regex"
severity = "suggestion"
message = "\"In an era of …\": Delete it and start with the subject."
description = "Scene-setting opener that delays the subject."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (era-of); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)(?:^|[.!?]\\s+|\\n)In\\s+(?:an?\\s+)?(?:era|age|world|time)\\s+of\\b"
examples = ["In an era of cheap compute, correctness is the constraint.\n"]
acceptable = ["The era of mainframes ended quietly.\n"]

[[rule]]
id = "slop.whether-youre-a"
kind = "regex"
severity = "suggestion"
message = "\"Whether you're an X or a Y\": Address the reader you actually have."
description = "The false-inclusive opener that addresses everyone and therefore no one."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (whether-youre-a); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bwhether\\s+you(?:['’]re|\\s+are)\\s+(?:an?\\s+)[\\w-]+\\s+or\\s+(?:an?\\s+)[\\w-]+\\b"
examples = ["Whether you're a beginner or an expert, this guide helps.\n"]
acceptable = ["We will ship it whether you are ready or not.\n", "Whether you are ready or not, it ships.\n"]

[[rule]]
id = "slop.think-of-it-as"
kind = "regex"
severity = "suggestion"
message = "\"Think of X as …\": Describe the thing before reaching for a metaphor."
description = "The explanatory analogy reflex, reached for before the plain description."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (think-of-it-as); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bthink\\s+of\\s+(?:it|this|that|(?:the|your|a|an)\\s+[\\w-]+|[\\w-]+)\\s+as\\s+(?:an?|the)\\b"
examples = ["Think of the cache as a shelf near the door.\n"]
acceptable = ["I think of her often.\n"]

[[rule]]
id = "slop.hedge-then-affirm"
kind = "regex"
severity = "suggestion"
message = "Hedge, then affirm: Say what is wrong with it, and how much that matters. If the answer is “not much”, drop the first half."
description = "The concession that costs nothing: “It's not perfect, but it works.” A weakness is admitted in a subordinate clause and immediately overridden, so the reader gets the feeling of balance without any of the information."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (hedge-then-affirm); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:it|this|that)(?:(?:['\\u2019]s|\\s+is|\\s+was)\\s+not|\\s+(?:isn|wasn)['\\u2019]t)\\s+(?:a\\s+|the\\s+|going\\s+to\\s+)?[\\w-]+(?:\\s+[\\w-]+)?,\\s+but\\s+(?:it|they|this|that|you|we|the)\\b"
examples = ["It's not perfect, but it works.\n", "This isn't elegant, but it does the job.\n", "It was not cheap, but the team shipped on time.\n"]
acceptable = ["It is not the answer we wanted.\n", "This is not a drill.\n", "It's not a bug but a feature.\n"]

[[rule]]
id = "slop.barely-a-whisper"
kind = "regex"
severity = "suggestion"
message = "“Voice barely above a whisper”: Let the line carry the volume, or say how loud they actually were."
description = "The single most over-represented construction in the creative-writing lists. It heads both the phrase list and the trigram list."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (barely-a-whisper); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bvoice\\s+(?:was\\s+)?barely\\s+(?:above\\s+)?(?:a\\s+)?(?:whisper|audible)\\b|\\bbarely\\s+above\\s+a\\s+whisper\\b|\\b(?:whispered|said|asked|murmured)[^.!?\\n]{0,20},?\\s+voice\\s+barely\\b"
examples = ["“I know,” she said, her voice barely above a whisper.\n", "His voice was barely audible over the rain.\n", "She answered, voice barely a whisper.\n"]
acceptable = ["He whispered the password.\n", "The whisper carried across the hall.\n"]

[[rule]]
id = "slop.heart-pounding"
kind = "regex"
severity = "suggestion"
message = "“Heart pounding in her chest”: Cut it, or give the body something specific to do."
description = "Interior-state telegraphing, and a redundancy: the heart is already in the chest."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (heart-pounding); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:heart|pulse)\\s+(?:was\\s+)?(?:pounding|hammering|thudding|racing|hammered|pounded|thundering)\\s+(?:in|against)\\s+(?:my|his|her|their|its|the)\\s+(?:chest|ribs|throat|ears)\\b|\\bheart\\s+(?:skipped|stopped)\\s+a\\s+beat\\b"
examples = ["Her heart was pounding in her chest.\n", "His heart hammered against his ribs.\n", "My heart skipped a beat.\n"]
acceptable = ["The drum pounded through the floor.\n", "She pressed a hand to her chest.\n"]

[[rule]]
id = "slop.shiver-down-spine"
kind = "regex"
severity = "suggestion"
message = "“Sent a shiver down her spine”: Pick a reaction that belongs to this character and this moment."
description = "The stock somatic reaction, present in four separate spellings in the shipped phrase list."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (shiver-down-spine); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:sent|felt|ran)\\s+(?:a\\s+)?(?:shiver|chill|shudder|tingle)s?\\s+(?:run\\s+|running\\s+)?(?:down|up|through)\\s+(?:my|his|her|their|the)\\s+spine\\b|\\b(?:shivers?|chills?)\\s+(?:ran\\s+|went\\s+)?(?:down|up)\\s+(?:my|his|her|their|the)\\s+spine\\b"
examples = ["The sound sent a shiver down her spine.\n", "He felt a chill run up his spine.\n", "Shivers ran down my spine.\n"]
acceptable = ["She traced a finger along his spine.\n", "The book's spine had cracked.\n"]

[[rule]]
id = "slop.sun-dipped-horizon"
kind = "regex"
severity = "suggestion"
message = "“The sun dipped below the horizon”: Say what time it is, or cut to what happens next."
description = "The establishing-shot sunset, usually followed by shadows being cast. Four of its fragments make the top-twenty trigrams."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (sun-dipped-horizon); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:sun|moon)\\s+(?:dipped|sank|slipped|dropped|hung|began\\s+to\\s+(?:set|dip|sink))\\s*(?:low\\s+)?(?:below|beneath|behind|toward|towards|in)?\\s*(?:the\\s+)?(?:horizon|sky)?\\b(?=[^.!?\\n]{0,40}(?:cast|casting|paint|painting|bath|bathing|glow))|\\bdipped\\s+below\\s+the\\s+horizon\\b|\\bcasting\\s+long\\s+shadows\\b"
examples = ["The sun dipped below the horizon, casting long shadows.\n", "The sun hung low in the sky, painting the fields orange.\n", "Streetlights came on, casting long shadows across the yard.\n"]
acceptable = ["The sun set at seven.\n", "She dipped the brush in the water.\n"]

[[rule]]
id = "slop.felt-like-eternity"
kind = "regex"
severity = "suggestion"
message = "“Felt like an eternity”: Give the real interval, or show what filled it."
description = "Duration inflation in place of an actual duration."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (felt-like-eternity); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:felt|seemed)\\s+like\\s+(?:an\\s+eternity|forever|hours)\\b|\\bfor\\s+what\\s+(?:felt|seemed)\\s+like\\s+(?:an\\s+eternity|forever|hours)\\b|\\btime\\s+(?:seemed\\s+to\\s+)?(?:stood|stand|slowed|stopped)\\s*(?:still)?\\b"
examples = ["The silence felt like an eternity.\n", "They waited for what seemed like hours.\n", "Time stood still.\n"]
acceptable = ["The flight felt long.\n", "It took an eternity to load, she joked.\n"]

[[rule]]
id = "slop.words-hung-in-air"
kind = "regex"
severity = "suggestion"
message = "“The words hung in the air”: Trust the line. If it needs help, the line is the problem."
description = "The beat of significance dropped after a line of dialogue, so the reader knows it landed."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (words-hung-in-air); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:words?|question|name|silence|accusation|threat)\\s+(?:still\\s+)?hung\\s+(?:heavy\\s+|thick\\s+)?(?:in|between)\\s+(?:the\\s+air|them|us)\\b|\\bair\\s+(?:hung\\s+|was\\s+)(?:thick|heavy)\\s+with\\b|\\bthe\\s+room\\s+fell\\s+silent\\b"
examples = ["The words hung in the air between them.\n", "The air was thick with the scent of smoke.\n", "The room fell silent.\n"]
acceptable = ["Laundry hung in the yard.\n", "The air smelled of rain.\n"]

[[rule]]
id = "slop.little-did-know"
kind = "regex"
severity = "suggestion"
message = "“Little did she know”: Delete it. The reader finds out anyway, and the tease costs the surprise."
description = "Narrator-flagged foreshadowing, including the closer that promises a sequel."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (little-did-know); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\blittle\\s+did\\s+(?:he|she|they|I|we|you|him|her|them)\\s+know\\b|\\b(?:he|she|they|I|we)\\s+had\\s+no\\s+way\\s+of\\s+knowing\\b|\\b(?:was|were)\\s+only\\s+just\\s+beginning\\b|\\bhad\\s+only\\s+just\\s+begun\\b|\\bwould\\s+never\\s+be\\s+the\\s+same\\b"
examples = ["Little did she know what waited upstairs.\n", "Their troubles were only just beginning.\n", "Life would never be the same.\n"]
acceptable = ["She knew little about the protocol.\n", "The meeting was just beginning.\n"]

[[rule]]
id = "slop.maybe-just-maybe"
kind = "regex"
severity = "suggestion"
message = "“Maybe, just maybe”: End on the last real thing that happened."
description = "The wistful closer. Both halves ship as separate entries in the phrase list, which is how often they co-occur."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (maybe-just-maybe); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:maybe|perhaps)\\s*,\\s*just\\s+(?:maybe|perhaps)\\b|\\b(?:and\\s+)?(?:for\\s+now\\s*,?\\s*)?(?:maybe\\s+)?that\\s+(?:was|is)\\s+enough\\s*(?=[.!?…]|$)|\\bfor\\s+now\\s*,\\s*that(?:'s|’s)\\s+enough\\b"
examples = ["Maybe, just maybe, they would make it.\n", "It was not much, but for now, that was enough.\n", "And maybe that was enough.\n"]
acceptable = ["Maybe we should leave.\n", "That was enough rope to reach the branch.\n"]

[[rule]]
id = "slop.face-it-together"
kind = "regex"
severity = "suggestion"
message = "“They would face it together”: Let the last scene stand without a summary of how everyone felt about it."
description = "The resolve-and-embrace ending, which resolves nothing."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (face-it-together); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:would|could|will)\\s+face\\s+(?:it|this|them|whatever\\s+(?:came|comes|lay|lies))\\s+(?:together|head[- ]on)\\b|\\bready\\s+(?:to\\s+face|for)\\s+whatever\\s+(?:came|comes|lay|lies|the\\s+\\w+\\s+(?:held|holds))\\b|\\bwhatever\\s+(?:came|comes)\\s+next\\b"
examples = ["Whatever came next, they would face it together.\n", "She was ready to face whatever the morning held.\n"]
acceptable = ["They faced each other across the table.\n", "He was ready for the interview.\n"]

[[rule]]
id = "slop.something-else-entirely"
kind = "regex"
severity = "suggestion"
message = "“Something else entirely”: Name it. If it cannot be named yet, describe what the character can actually perceive."
description = "Withholding as a substitute for description: the thing is named only as not-the-other-thing."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (something-else-entirely); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\bsomething\\s+else\\s+entirely\\b|\\bsomething\\s+(?:else\\s+)?(?:darker|deeper|colder|older|far\\s+worse)\\b|\\bunlike\\s+anything\\s+(?:he|she|they|I|we)\\s+had\\s+ever\\s+(?:seen|felt|heard|known)\\b|\\bone\\s+thing\\s+was\\s+certain\\b"
examples = ["This was something else entirely.\n", "There was something darker behind the door.\n", "It was unlike anything she had ever seen.\n"]
acceptable = ["We ordered something else.\n", "The room was darker than he remembered.\n"]

[[rule]]
id = "slop.semicolon-correction"
kind = "regex"
severity = "suggestion"
message = "The denial, a semicolon, the restatement: Make it two sentences, or lead with the positive claim and cut the denial. Turning every one into a dash or a full stop swaps one habit for another, so vary how the correction arrives."
description = "A claim is denied, a semicolon follows, and the corrected version arrives in the same sentence: \"the system has not reduced harm; it has relocated the burden\". The semicolon is doing the work a full stop or a plain \"but\" would do, and the shape repeats. Measured across 88 human documents and 193,000 words the construction appeared twice; across 18 AI documents and 17,000 words it appeared eleven times, in seven of them. Only verbal negation counts: \"no longer upright; he\" and \"no reference to former roses; they\" are the determiner, and human essayists write those."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (semicolon-correction); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:is|was|are|were|has|have|had|do|does|did|will|would|can|could)\\s+not\\b[^;.!?\\n]{3,90};\\s+(?:it|they|he|she|we|this|that|the)\\b"
examples = ["The system has not reduced harm; it has relocated the burden onto the person harmed.\n", "She did not abandon plant-based eating; she widened it, food by food.\n", "The standard library did not become less correct during those four years; the world around it moved.\n", "Conventional food, in this account, was not merely fattening; it was contaminating.\n", "A great many security fixes are not one-line corrections to a single driver; they require reworking an internal interface.\n"]
acceptable = ["Man is timid and apologetic; he is no longer upright.\n", "These roses make no reference to former roses or to better ones; they are for what they are.\n", "The port is busy; the operators are turning ships away.\n", "It was not the solver. It was the model.\n", "The tagger is not accurate, but it is fast.\n"]

[[rule]]
id = "slop.load-bearing-adverbs"
kind = "regex"
severity = "suggestion"
message = "merely, plainly, quietly, genuinely: Cut the word and read the sentence again. If it lost something, the sentence was leaning on the adverb for a certainty it had not earned, so make the claim itself weaker or stronger. \"Merely\" usually wants the sentence turned around to say what the thing is."
description = "Four adverbs that AI writing reaches for and human writing rarely does: merely, plainly, quietly, genuinely. They are adverbs of stance rather than of manner, telling a reader how firmly to take the sentence instead of adding anything to it.\n\nAcross 88 human documents in this repo's audit the four appear once in total; across 18 AI documents they appear 23 times, in 12 of them. In louisabraham/load-bearing, which measured 461,000 pull request descriptions, each is written 14 to 34 times more often inside the group that arrived than outside it."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/ai-tells.json (load-bearing-adverbs); data/slop/rules/ai-tells.json"
license = "bheijden/slop (Apache-2.0, Copyright 2026 Bas van der Heijden; see data/slop/NOTICE)."
pattern = "(?i)\\b(?:merely|plainly|quietly|genuinely)\\b"
examples = ["A tagger that fails on the variety is not merely inaccurate.\n", "The review board should say so plainly before it votes.\n", "What the report quietly asserts is that the defect predates the release.\n", "The asymmetry it introduces is genuinely new.\n"]
acceptable = ["The council approved the plan on Tuesday evening.\n", "It was a mere formality, and the plain answer is no.\n", "The room was quiet and her surprise was genuine.\n", "The merit of the approach is that it is genuine work.\n"]

[[rule]]
id = "slop.whole"
kind = "regex"
severity = "warning"
message = "“That’s the whole …”: Name the thing directly instead of gesturing at its totality."
description = "“That / this is the whole point, game, thing …”"
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (whole); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:that|this)(?:['\\u2019]s|\\s+(?:is|was))\\s+the\\s+whole\\b(?:\\s+\\w+)?"
examples = ["That's the whole point.\n", "This is the whole game, really.\n", "That was the whole pitch.\n"]
acceptable = ["The whole team showed up.\n"]

[[rule]]
id = "slop.sit-with"
kind = "regex"
severity = "warning"
message = "“Sit with that”: Say what the reader should conclude, not that they should dwell."
description = "The reflective “sit with that / this / it (for a moment)”, plus “sit with the discomfort” and friends."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (sit-with); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bsit(?:s|ting)?\\s+with\\s+(?:that|this|it|(?:the|your)\\s+(?:discomfort|feelings?|tension|weight|uncertainty|ambiguity|grief|silence|unease))\\b(?:\\s+for\\s+a\\s+\\w+)?"
examples = ["Sit with that for a moment.\n", "Just sit with it.\n", "She was sitting with the discomfort.\n"]
acceptable = ["Come sit with us at lunch.\n"]

[[rule]]
id = "slop.already-know"
kind = "regex"
severity = "warning"
message = "“You already know”: Either state the answer or ask a real question. Do not flatter."
description = "“You already know” — the answer, what to do, or standing alone before a full stop."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (already-know); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\byou\\s+already\\s+knows?\\s+(?:the\\s+answer|what|how|why|this|that|it|who|where)\\b|\\byou\\s+already\\s+knows?\\b(?![ \\t]+\\w)"
examples = ["You already know the answer.\n", "Deep down, you already know.\n", "You already know what to do.\n", "Part of you already knows it.\n"]
acceptable = ["If you already know Python, skip ahead.\n"]

[[rule]]
id = "slop.is-the-entire"
kind = "regex"
severity = "warning"
message = "“Is the entire …”: Replace the totalising claim with the specific mechanism."
description = "“X is the entire point / game / business model.”"
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (is-the-entire); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)(?:\\b(?:is|was|are|were)|['\\u2019]s)\\s+the\\s+entire\\b(?:\\s+\\w+)?"
examples = ["Consistency is the entire game.\n", "That's the entire business model.\n"]
acceptable = ["He toured the entire factory.\n"]

[[rule]]
id = "slop.the-entire-is"
kind = "regex"
severity = "warning"
message = "“The entire … is”: Replace the totalising claim with the specific mechanism."
description = "“The entire point / game / business model is …” — the flipped twin of “is the entire”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (the-entire-is); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bthe\\s+entire\\s+[\\w'\\u2019-]+(?:\\s+[\\w'\\u2019-]+){0,4}?\\s+(?:is|was|are|were)\\b"
examples = ["The entire point is that nobody reads.\n", "The entire business model is built on churn.\n", "The entire point of the exercise is repetition.\n", "The entire team was exhausted.\n"]
acceptable = ["He ate the entire pizza.\n", "The entire history of the modern industrial world economy is complex.\n"]

[[rule]]
id = "slop.is-real"
kind = "regex"
severity = "warning"
message = "“Is real … and / not”: Cut \"is real\". Give the evidence that makes it real."
description = "“The X is real, and / not …”, including “is the real … and it”. Skips “real estate”, “real time”, and similar."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (is-real); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bis\\s+(?:(?:the|a)\\s+real\\b(?![\\s-]+(?:estate|time|life|world|quick)\\b)[^.!?\\n]*?\\b(?:and|not)\\s+it\\b|real\\b(?![\\s-]+(?:estate|time|life|world|quick)\\b)[^.!?\\n]*?\\b(?:and|not)\\b)"
examples = ["The improvement is real, and it's not subtle.\n", "This is the real work, and it never ends.\n", "The demand is real and growing.\n"]
acceptable = ["He is a real estate agent and it shows.\n", "Is it real? And does it matter?\n", "The painting is real, but stolen.\n"]

[[rule]]
id = "slop.punchline"
kind = "regex"
severity = "warning"
message = "“The punchline is”: Deliver the point without announcing that a point is coming."
description = "“The punchline is …”, “the punchline:”, or “the punchline?”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (punchline); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bthe\\s+punchline(?:\\s+(?:is|was|being)\\b|\\s*[:?])"
examples = ["The punchline is that nobody laughed.\n", "The punchline: nothing changed.\n", "And the punchline? You knew.\n"]
acceptable = ["He forgot the punchline entirely.\n"]

[[rule]]
id = "slop.worth-naming"
kind = "regex"
severity = "warning"
message = "“Worth naming”: Name it, or cut it. Announcing that something deserves naming is not naming it."
description = "The therapist-voiced “that loss is real and it’s worth naming”, “it’s worth naming that …”, or a “Worth naming:” opener. Skips “naming names”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (worth-naming); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)(?:\\b(?:is|are|was|were|feels?|felt|seems?|seemed)|['\\u2019]s)\\s+(?:\\w+\\s+){0,2}?worth\\s+naming\\b(?!\\s+names\\b)|\\bworth\\s+naming\\s*:"
examples = ["That loss is real and it's worth naming.\n", "It’s worth naming that this hurts.\n", "The grief here is worth naming.\n", "That anger feels worth naming out loud.\n", "Worth naming: nobody asked for this.\n"]
acceptable = ["It's not worth naming names here.\n", "They spent the meeting naming the new mascot.\n", "The naming convention is worth documenting.\n"]

[[rule]]
id = "slop.not-nothing"
kind = "regex"
severity = "warning"
message = "“That’s not nothing”: Quantify it. \"Not nothing\" concedes and asserts at once, saying neither."
description = "“That is not nothing” / “that’s not nothing”, plus the “this / it / which is not nothing” variants."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (not-nothing); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:that|this|it|which)(?:['\\u2019]s|\\s+(?:is|was))\\s+not\\s+nothing\\b"
examples = ["That's not nothing.\n", "Ten sign-ups in a week — that is not nothing.\n", "It's not nothing, even if it's not everything.\n", "The launch drew a small crowd, which was not nothing.\n"]
acceptable = ["She insisted that nothing was wrong.\n", "There is nothing left to say.\n"]

[[rule]]
id = "slop.is-the-whole"
kind = "regex"
severity = "warning"
message = "“Is the whole …”: Name the thing directly instead of gesturing at its totality."
description = "Any subject + “is the whole point / trick / pitch / idea”, plus the “here is the whole …” opener. The twin of “is the entire …”, and a generalisation of “That’s the whole …” to subjects other than that/this."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (is-the-whole); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)(?:\\b(?:is|was|are|were)|['’]s)\\s+the\\s+whole\\b(?:\\s+\\w+)?|\\bhere(?:['’]s|\\s+is)\\s+the\\s+whole\\b(?:\\s+\\w+)?"
examples = ["Distribution is the whole game.\n", "Here's the whole pitch in one slide.\n", "That was the whole point of the meeting.\n"]
acceptable = ["The whole team showed up.\n"]

[[rule]]
id = "slop.performative-honesty"
kind = "regex"
severity = "warning"
message = "Performative honesty: Delete the preamble. Honest writing does not announce itself."
description = "Sincerity announced rather than demonstrated: “I won’t pretend”, “I’ll be honest”, “let’s be honest”, “to be clear”, and sentence-initial “Honestly,” or “Look,”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (performative-honesty); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bI\\s+(?:will\\s+not|won['’]t)\\s+pretend\\b|\\b(?:I['’]ll|let['’]s|to)\\s+be\\s+(?:honest|clear|blunt|real)\\b|(?:^|[.!?–—]\\s+|\\n)(?:Honestly|Look|Truthfully|Frankly)\\s*,"
examples = ["I won't pretend the migration was painless.\n", "Let's be honest: nobody reads the docs.\n", "To be clear, the API is unchanged.\n", "Honestly, it was fine.\n"]
acceptable = ["She answered honestly.\n", "Look at the diagram.\n"]

[[rule]]
id = "slop.thats-the-part"
kind = "regex"
severity = "warning"
message = "“That’s the part …”: State the detail instead of pointing at it."
description = "Gesturing at a favoured detail instead of stating it: “that is the part a counter can’t reach”, “the part that makes me trust the rest”, “my favourite part of …”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (thats-the-part); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:that|this|it)(?:['’]s|\\s+(?:is|was))\\s+the\\s+part\\b|\\bthe\\s+part\\s+that\\s+(?:makes|made|gets|got|keeps|kept)\\s+(?:me|you|us|it)\\b|\\bmy\\s+favou?rite\\s+part\\s+of\\b"
examples = ["That's the part a counter can't reach.\n", "The part that makes me trust the rest is the errata.\n", "My favorite part of the demo was the undo.\n"]
acceptable = ["He played the part of the villain.\n"]

[[rule]]
id = "slop.the-only-i-trust"
kind = "regex"
severity = "warning"
message = "“The only X I trust”: Drop the superlative framing and give the actual reason."
description = "The narrowing superlative reveal: “the only marketing I trust”, “the only thing it needs”, “the only X that matters”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (the-only-i-trust); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bthe\\s+only\\s+[\\w'’-]+(?:\\s+[\\w'’-]+){0,2}?\\s+(?:I|you|we|it|he|she|they)\\s+(?:trust|need|needs|care|want|wants|use|uses|believe)\\b|\\bthe\\s+only\\s+[\\w'’-]+\\s+that\\s+(?:matters|counts|works|survives)\\b"
examples = ["It’s the only marketing I trust.\n", "The only benchmark that matters is retention.\n", "The only thing it needs is a cache.\n"]
acceptable = ["She was the only engineer on call.\n"]

[[rule]]
id = "slop.take-my-word"
kind = "regex"
severity = "warning"
message = "“Don’t take my word for it”: Just link the evidence."
description = "The stock invitation to verify: “you don’t have to take my word for it”, “don’t take my word for any of this”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (take-my-word); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:you\\s+)?(?:do\\s+not|don['’]t)\\s+(?:have\\s+to\\s+)?take\\s+my\\s+word\\s+for\\s+(?:it|any\\s+of\\s+(?:it|this|that))\\b"
examples = ["You don't have to take my word for it.\n", "Don't take my word for any of this.\n"]
acceptable = ["He kept his word.\n"]

[[rule]]
id = "slop.turns-out"
kind = "regex"
severity = "warning"
message = "“Turns out …”: State the finding without the casual-reveal framing."
description = "The casual-revelation opener, almost always bolted to a tidy conclusion: “Turns out X”, “it turns out that X”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (turns-out); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)(?:^|[.!?–—]\\s+|\\n)Turns\\s+out\\b|\\bit\\s+turns\\s+out\\s+that\\b"
examples = ["Turns out the cache was never warm.\n", "It turns out that nobody tested it.\n"]
acceptable = ["She turns out solid work every week.\n"]

[[rule]]
id = "slop.fits-in-your-head"
kind = "regex"
severity = "warning"
message = "“Fits in your head”: Give the concrete measure - lines of code, number of concepts, setup steps."
description = "Dev-blog boilerplate for simplicity: “small enough to hold in your head”, “batteries included”, “it just works”, “zero config”, “sane defaults”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (fits-in-your-head); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:hold|fit|fits|holds|held)\\s+(?:it\\s+)?in\\s+your\\s+head\\b|\\bbatteries[-\\s]included\\b|\\bit\\s+just\\s+works\\b|\\bzero[-\\s]config(?:uration)?\\b|\\bsane\\s+defaults\\b"
examples = ["The design is small enough to hold in your head.\n", "It ships with sane defaults and zero config.\n", "Install it and it just works.\n"]
acceptable = ["We choose boring technology on purpose.\n", "The helmet fits your head.\n"]

[[rule]]
id = "slop.colon-triple"
kind = "regex"
severity = "warning"
message = "Colon into a triple: Check the three items are the real count. Cut to the ones that carry weight, or drop the colon and write the sentence out."
description = "A colon opening onto three or more comma-separated prose items: “separate ports, processes, and local state”. The most common shape LLM prose uses to sound concrete. Tightened from upstream: items must read as prose, not as code, measurements or proper-noun lists."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (colon-triple); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = ":\\s+[a-z][^.!?;:\\n,=\\[\\]\\(\\)\\{\\}\"'\\/\\\\|_~^%*+<>&#@$\\u2192\\u21d2\\u2194\\u00b0]{1,39},\\s+[a-z][^.!?;:\\n,=\\[\\]\\(\\)\\{\\}\"'\\/\\\\|_~^%*+<>&#@$\\u2192\\u21d2\\u2194\\u00b0]{1,39},\\s+(?:and\\s+|or\\s+)?[a-z][^.!?;:\\n,=\\[\\]\\(\\)\\{\\}\"'\\/\\\\|_~^%*+<>&#@$\\u2192\\u21d2\\u2194\\u00b0]{1,39}(?=[.!?\\n])"
examples = ["The fix needs three things: separate ports, separate processes, and separate state.\n", "Each service gets its own everything: ports, processes, local state.\n", "It splits into three: the core, the accumulated solver craft, and the agent harness around it.\n", "What it buys: continuous calibration against live data, regression gates on every model edit, and drift alarms that fire early.\n"]
acceptable = ["The recipe calls for flour, butter, and sugar.\n", "Note: the flag is off by default.\n", "svd_mode: SVD mode (\"truncate\", \"damp\", or None).\n", "Returns: theta_opt, cost_history, primary_rms_history.\n", "Chipset: Intel CNVi, hci0, BlueZ 5.\n", "Exit codes: clean, findings over budget, usage/read error.\n", "Reroot k: B=per[k], per[0]=I, per[j]=B-1per[j].\n", "Checks: oracle, gauge-invariance, FK/residual/J parity.\n", "Units: vessels, exchangers, columns, reactors.\n", "Four layers: Frontend Experience, API & Gateway, Cognitive Orchestration, Physical Execution.\n", "The stack: UI, visualization, local SDK in one place.\n", "Pipeline: Perception, Planning, Actuation, Orchestration.\n", "Laptop: Alienware m15 R4, Intel Wi-Fi 6 AX200, Ubuntu 20.\n", "iw shows HE-MCS 11 at 1 Gbps, signal -30 to -40 dBm, 0% packet loss.\n"]

[[rule]]
id = "slop.heres-the-twist"
kind = "regex"
severity = "warning"
message = "“Here’s the twist”: Cut the stage direction and give the content."
description = "The stage-managed reveal: “here’s the twist”, “here’s the thing”, “here’s the catch / kicker / rub”, “here’s the first example:”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (heres-the-twist); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\bhere(?:['’]s|\\s+is)\\s+(?:the|a|my|one)\\s+(?:twist|thing|catch|kicker|rub|problem|first|second|third|next|recent|real|best|worst|surprising|interesting|key|important)\\b[\\w\\s-]{0,20}[:.]"
examples = ["Here's the twist: nobody clicked it.\n", "Here is the thing. The demo was fake.\n", "Here's a surprising result: it got faster.\n"]
acceptable = ["Here's the door code.\n"]

[[rule]]
id = "slop.x-is-dead"
kind = "regex"
severity = "warning"
message = "“X is dead”: Say what changed and for whom, instead of the obituary headline."
description = "The obituary headline and its sequel: “peer code review is dead”, “botd is dead; long live botd”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (x-is-dead); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b[\\w\\s]{3,30}\\s+(?:is|are)\\s+dead\\b|\\blong\\s+live\\s+\\w+"
examples = ["Peer code review is dead.\n", "The old importer is dead; long live the importer.\n", "Long live the king.\n"]
acceptable = ["He played dead until the bear left.\n"]

[[rule]]
id = "slop.thats-why-mattered"
kind = "regex"
severity = "warning"
message = "“That’s why X mattered”: State the consequence directly rather than asserting significance."
description = "Retroactively assigning significance: “that’s why being able to open the environment mattered”, “this is why preserving every conversation mattered”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (thats-why-mattered); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "(?i)\\b(?:that|this)(?:['’]s|\\s+(?:is|was))\\s+why\\b[^.!?\\n]{0,80}?\\b(?:matter(?:s|ed)?|count(?:s|ed)?)\\b"
examples = ["That's why being able to open the environment mattered.\n", "This is why preserving every conversation mattered.\n", "That's why the deadline counts.\n"]
acceptable = ["That is why we left early.\n"]

[[rule]]
id = "slop.stranded-auxiliary"
kind = "regex"
severity = "warning"
message = "Stranded auxiliary contrast: Complete the clause. The bare auxiliary is a rhythm trick, not information."
description = "A clause that lands on a bare auxiliary for the reversal: “The tool died; the data didn’t.”, “Reading mostly passed … Writing didn’t”, “Maybe it wouldn’t have.”"
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/simonwillison.json (stranded-auxiliary); data/slop/rules/simonwillison.json"
license = "bheijden/slop (Apache-2.0), derived from Simon Willison's llm-cliche-highlighter (Apache-2.0); see data/slop/NOTICE."
pattern = "[;:,]\\s+[^.;:!?\\n]{2,50}\\s(?:did|does|do|was|were|is|are|has|have|had|can|could|would|will)(?:n['’]t)?\\s*[.;]|\\b(?:Maybe|Perhaps)\\s+\\w+[^.!?\\n]{0,40}\\s(?:would|could|might|should|did|had|was|is)(?:n['’]t)?\\s+(?:have\\s*)?\\."
examples = ["The tool died; the data didn't.\n", "Reading mostly passed, writing didn't.\n", "Maybe it wouldn't have.\n"]
acceptable = ["The test passed and the build was green.\n"]

[[rule]]
id = "slop.ai-vocab"
kind = "regex"
severity = "warning"
message = "AI vocabulary words: Swap for a plainer word. One hit is coincidence; several is a tell."
description = "Words LLMs lean on far more than people do: “delve”, “tapestry”, “meticulous”, “pivotal”, “intricate”, “interplay”, “underscore”, “garner”, “bolster”, “vibrant”, “bustling”, “multifaceted”, “seamless”, “ever-evolving”. One hit can be coincidence — several is a tell."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (ai-vocab); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\b(?:delv(?:e|es|ed|ing)|tapestr(?:y|ies)|meticulous(?:ly)?|pivotal|intricate(?:ly)?|intricacies|interplay|underscor(?:e|es|ed|ing)|garner(?:s|ed|ing)?|bolster(?:s|ed|ing)?|vibrant|bustling|multifaceted|seamless(?:ly)?|commendable|ever-evolving)\\b"
examples = ["We delve into the intricacies of the interplay.\n", "Her vibrant tapestry hung in the bustling hall.\n", "A meticulously curated, seamless experience.\n"]
acceptable = ["The report was thorough and well organized.\n"]

[[rule]]
id = "slop.not-just"
kind = "regex"
severity = "warning"
message = "“Not just X, but Y”: Pick the accurate half. Negative parallelism inflates without adding."
description = "Negative parallelisms: “not just X, but (also) Y”, “not only … but …”, and the “it’s not X — it’s Y” contrast."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (not-just); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bnot\\s+(?:just|only|merely|simply)\\s+(?!because|when|if|since|though|although|that\\b|as\\b|to\\b|in\\s+order)[^.!?\\n;]{1,50}?,?\\s+but(?:\\s+also)?\\b|\\b(?:it|this|that)(?:['\\u2019]s|\\s+(?:is|was))\\s+not\\s+[^.!?\\n,;\\u2014\\u2013]{1,60}[,;\\u2014\\u2013]\\s*(?:it|this|that)(?:['\\u2019]s|\\s+(?:is|was))\\b"
examples = ["This is not just a tool, but a philosophy.\n", "It was not merely mistaken, but dangerous.\n", "Not only fast but also reliable.\n", "It’s not a bug — it’s a feature.\n"]
acceptable = ["He did not buy it.\n", "She was not sure about the plan.\n", "not only because performance differences impair the system, but the effect is small\n"]

[[rule]]
id = "slop.note-that"
kind = "regex"
severity = "warning"
message = "“It’s important to note”: Delete the hedge and state the fact."
description = "Didactic hedging: “it is important to note that”, “it’s worth noting”, “it should be noted”, plus the “worth pausing / considering / asking” family."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (note-that); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bit(?:['\\u2019]s|\\s+(?:is|was))\\s+(?:also\\s+)?(?:important|worth|crucial|essential|vital)\\s+(?:to\\s+(?:note|remember|understand|recognize|mention|pause|consider|ask)|noting|mentioning|remembering|pausing|considering|asking)\\b(?:\\s+that\\b)?|\\bit\\s+should\\s+be\\s+noted\\b"
examples = ["It is important to note that timing matters.\n", "It’s worth noting the fees are separate.\n", "It should be noted that this changed in 2020.\n", "It's worth pausing on that number.\n", "It is worth asking who benefits.\n"]
acceptable = ["Please note the door code.\n"]

[[rule]]
id = "slop.testament"
kind = "regex"
severity = "warning"
message = "“Stands as a testament”: Say what happened instead of what it supposedly proves."
description = "“Stands / serves as a testament (or reminder)”, “is a testament to” — inflating significance instead of saying what happened."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (testament); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\b(?:stand|stands|stood|serve|serves|served|standing|serving)\\s+as\\s+(?:a|an)\\s+(?:\\w+\\s+)?(?:testament|reminder)\\b|\\b(?:is|was|are|were|remain|remains)\\s+a\\s+(?:\\w+\\s+)?testament\\s+to\\b"
examples = ["The building stands as a testament to postwar optimism.\n", "Her career is a testament to persistence.\n", "It serves as a stark reminder that nothing lasts.\n"]
acceptable = ["He read from the Old Testament.\n"]

[[rule]]
id = "slop.crucial-role"
kind = "regex"
severity = "warning"
message = "“Plays a crucial role”: Say what it actually does."
description = "“Plays a crucial / pivotal / vital / key / significant role in …”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (crucial-role); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bplay(?:s|ed|ing)?\\s+(?:a|an)\\s+(?:\\w+\\s+)?(?:crucial|pivotal|vital|key|significant|central|critical|important)\\s+role\\b"
examples = ["Volunteers play a crucial role in the program.\n", "She played a truly pivotal role in the merger.\n"]
acceptable = ["He plays the role of the villain.\n"]

[[rule]]
id = "slop.landscape"
kind = "regex"
severity = "warning"
message = "“Ever-evolving landscape”: Cut the scene-setting and start with the subject."
description = "Scene-setting boilerplate: “the ever-evolving / changing / shifting landscape”, “in today’s fast-paced world”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (landscape); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\b(?:ever-)?(?:evolving|changing|shifting)\\s+landscape\\b|\\bin\\s+today['\\u2019]s\\s+(?:fast-paced|ever-changing|ever-evolving|digital|modern|competitive)\\s+\\w+"
examples = ["Adapting to an ever-evolving landscape.\n", "The rapidly changing landscape of retail.\n", "In today’s fast-paced world, attention is scarce.\n"]
acceptable = ["The landscape outside the window was gray.\n"]

[[rule]]
id = "slop.vague-experts"
kind = "regex"
severity = "warning"
message = "“Experts argue”: Name the source, or drop the claim."
description = "Vague attribution to unnamed authorities: “experts argue”, “some critics have noted”, “observers suggest”, “industry reports indicate”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (vague-experts); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\b(?:many|some|several|most|numerous)?\\s*(?:experts|critics|observers|scholars|analysts|commentators)\\s+(?:have\\s+|often\\s+|widely\\s+)?(?:argu(?:e|es|ed)|not(?:e|es|ed)|suggest(?:s|ed)?|believ(?:e|es|ed)|agree[ds]?|contend(?:s|ed)?|observ(?:e|es|ed)|caution(?:s|ed)?|claim(?:s|ed)?|cit(?:e|es|ed)|point(?:s|ed)?\\s+out)\\b|\\bindustry\\s+reports?\\s+(?:suggest|indicate|show)\\w*\\b"
examples = ["Experts argue that the policy failed.\n", "Some critics have noted a decline in quality.\n", "Industry reports suggest strong demand.\n"]
acceptable = ["Dr. Chen argued the opposite in her paper.\n"]

[[rule]]
id = "slop.despite-challenges"
kind = "regex"
severity = "warning"
message = "“Despite these challenges”: Replace the formula with the specific challenge and outcome."
description = "The boilerplate challenges-and-outlook formula: “despite these challenges”, “faces several challenges”, “challenges remain”, “remains to be seen”, “time will tell”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (despite-challenges); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bdespite\\s+(?:these|those|such|its|their|the|numerous|significant|ongoing)\\s+(?:\\w+\\s+)?challenges\\b|\\bfac(?:e|es|ed|ing)\\s+(?:several|numerous|many|significant|various|a\\s+number\\s+of)\\s+challenges\\b|\\bchallenges\\s+remain\\b|\\bremains\\s+to\\s+be\\s+seen\\b|\\b(?:only\\s+)?time\\s+will\\s+tell\\b"
examples = ["Despite these challenges, growth continued.\n", "The sector faces several challenges.\n", "Whether it works remains to be seen.\n", "Only time will tell whether it sticks.\n", "Time will tell.\n"]
acceptable = ["He arrived on time and will tell you himself.\n", "The climb was a challenge.\n"]

[[rule]]
id = "slop.participle-tail"
kind = "regex"
severity = "warning"
message = "Participle sentence tails: End the sentence. The participle tail adds commentary, not information."
description = "Superficial analysis bolted onto a sentence end: “…, highlighting / underscoring / showcasing / reflecting the …”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (participle-tail); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i),\\s+(?:highlighting|underscoring|emphasizing|showcasing|reflecting|demonstrating|illustrating|signaling|solidifying|cementing|reinforcing|underlining)\\s+(?:its|his|her|their|our|the|a|an|how|that|what|both)\\b[^.!?\\n]*"
examples = ["The bridge reopened in June, highlighting the city’s investment in infrastructure.\n", "Sales doubled, underscoring the strength of the brand.\n"]
acceptable = ["She kept highlighting passages in yellow.\n", "The team, reflecting on the loss, regrouped.\n"]

[[rule]]
id = "slop.promo"
kind = "regex"
severity = "warning"
message = "Promotional boilerplate: Drop the brochure register and describe plainly."
description = "Travel-brochure tone: “nestled in”, “in the heart of”, “rich tapestry / heritage”, “hidden gem”, “boasts a”, “breathtaking”, “stunning views”."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (promo); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bnestled\\s+(?:in|on|among|between|along|at)\\b|\\bin\\s+the\\s+heart\\s+of\\b|\\brich\\s+(?:cultural\\s+|historical\\s+)?(?:heritage|history|tapestry)\\b|\\bhidden\\s+gem\\b|\\bmust-(?:visit|see|try)\\b|\\bbreathtaking\\b|\\bboasts?\\s+(?:a|an|the)\\b|\\bstunning\\s+(?:views?|scenery|architecture|backdrop)\\b"
examples = ["The inn is nestled in a quiet valley.\n", "The museum boasts a rich tapestry of exhibits.\n", "Located in the heart of downtown.\n", "A hidden gem with breathtaking views.\n"]
acceptable = ["The soup was rich and hearty.\n"]

[[rule]]
id = "slop.ai-leftovers"
kind = "regex"
severity = "warning"
message = "Chatbot leftovers: Remove the artifact. This is chatbot output pasted verbatim."
description = "Artifacts pasted straight from a chatbot: “as an AI language model”, “as of my last update”, “knowledge cutoff”, plus markup debris like “oaicite”, “contentReference”, “turn0search” and “utm_source=” tracking parameters."
source = "https://github.com/bheijden/slop/blob/6af32460028c96e5144c08fff2e2d44a2bbed9be/rules/wikipedia-ai.json (ai-leftovers); data/slop/rules/wikipedia-ai.json"
license = "bheijden/slop, adapted from Wikipedia's \"Signs of AI writing\" (CC BY-SA 4.0, Wikipedia contributors); see data/slop/NOTICE."
pattern = "(?i)\\bas\\s+an\\s+ai(?:\\s+language)?\\s+model\\b|\\bas\\s+of\\s+my\\s+last\\s+(?:update|training)\\b|\\bknowledge\\s+cutoff\\b|\\bI\\s+(?:cannot|can['\\u2019]t|do\\s+not|don['\\u2019]t)\\s+(?:browse\\s+the\\s+internet|access\\s+real-?time)\\b|contentReference|oaicite|turn0(?:search|news|image)\\d*|attributableIndex|utm_source="
examples = ["As of my last update, the API was in beta.\n", "As an AI language model, I cannot form opinions.\n", "See example.com/page?utm_source=chatgpt.com for details.\n", "contentReference[oaicite:0]{index=0}\n"]
acceptable = ["The last update shipped on Tuesday.\n"]
