"the administrator access level" = "administrator access"
"to login" = "to log in"
"to log-in" = "to log in"
"to setup" = "to set up"
"to signin" = "to sign in"
"to sign-in" = "to sign in"
"x509" = "X.509"
"on the left sidebar" = "in the left sidebar"
"on the sidebar" = "in the sidebar"
"yml" = "YAML"

[[rule]]
id = "gitlab.to-do"
kind = "substitution"
severity = "warning"
message = "Use 'to-do item' in most cases, or 'Add a to do' if referring to the UI button."
description = "You should not use \"To Do\", unless it refers to the UI element."
source = "https://docs.gitlab.com/development/documentation/styleguide/word_list/#to-do-item; data/vale/gitlab/gitlab_base/ToDo.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
[rule.swap]
"[Tt]o [Dd]o [Ii]tems?" = "to-do item"
"\\w* [Aa] [Tt]o [Dd]o" = "Add a to do"

[[rule]]
id = "gitlab.unclear-antecedent"
kind = "existence"
severity = "warning"
message = "Instead of '{match}', try starting this sentence with a specific subject and verb."
description = "Checks for words that need a noun for clarity."
source = "https://docs.gitlab.com/development/documentation/styleguide/word_list/#this-these-that-those; data/vale/gitlab/gitlab_base/UnclearAntecedent.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
tokens = [
  "That is",
  "That was",
  "There are",
  "There were",
  "These are",
  "These were",
  "This is",
  "This was",
  "Those are",
  "Those were",
]
examples = ["We saw That is in the draft.\n"]

[[rule]]
id = "gitlab.units"
kind = "existence"
severity = "warning"
message = "Add a space between the number and the unit in '{match}'."
description = "Recommends a space between a number and a unit of measure."
source = "https://docs.gitlab.com/development/documentation/styleguide/; data/vale/gitlab/gitlab_base/Units.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
ignorecase = true
nonword = true
tokens = [
  "\\d+(?:B|kB|KiB|MB|MiB|GB|GiB|TB|TiB)",
  "\\d+(?:ns|ms|μs|s|min|h|d)\\b",
]

[[rule]]
id = "gitlab.word-slash-word"
kind = "existence"
severity = "suggestion"
message = "Rewrite word/word combos like '{match}' to not use slashes."
description = "Do not use word/word combos with slashes."
source = "https://docs.gitlab.com/development/documentation/styleguide/word_list/#slashes; data/vale/gitlab/gitlab_base/WordSlashWord.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
ignorecase = true
nonword = true
tokens = [
  "and/or",
  "follow/unfollow",
  "go/no-go",
]

[[rule]]
id = "gitlab.wordy"
kind = "substitution"
severity = "suggestion"
message = "{replacement}"
description = "Suggests shorter versions of wordy phrases."
source = "https://docs.gitlab.com/development/documentation/styleguide/word_list/; data/vale/gitlab/gitlab_base/Wordy.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
ignorecase = true
examples = ["We saw a number of in the draft.\n"]
[rule.swap]
"a number of" = "Specify the number or remove the phrase."
"as well as" = "Use 'and' instead of 'as well as'."
"note that" = "Remove the phrase 'note that'."
"please" = "Use 'please' only if we've inconvenienced the user."
"respectively" = "Remove 'respectively' and list each option instead."
"and so on" = "Remove 'and so on'. Try to use 'like' and provide examples instead."
"in order to" = "Remove 'in order' and leave 'to'."
"quite" = "Remove 'quite', as it's wordy."

[[rule]]
id = "gitlab.zip"
kind = "existence"
severity = "error"
message = "Wrap '{match}' in backticks to prevent unintentional links to .zip domain names."
description = "Recommends all instances of something.zip be wrapped in backticks\ndue to the .zip top-level domain"
source = "https://docs.gitlab.com/development/documentation/styleguide/#inline-code; data/vale/gitlab/gitlab_base/Zip.yml"
license = "GitLab documentation Vale rules, doc/.vale/gitlab_base (CC BY-SA 4.0, Copyright GitLab Inc.; see data/vale/gitlab/SOURCE.md)."
ignorecase = true
nonword = true
tokens = [
  "\\b\\w*\\.zip",
]
