[pack]
name = "substance"
description = "Hedged, vague and unsupported claims: what a reader cannot check or act on."

[[rule]]
id = "substance.hedge-verb"
kind = "construction"
severity = "suggestion"
message = "'{match}' hedges the claim; state it directly, or say what it depends on."
description = "Raising verbs and adjectives that distance the writer from a claim: 'seems to', 'appears to', 'tends to', 'is likely to'. Found in the grammar's analysis, so 'appear on stage' or 'a likely story' are not flagged."
entries = ["seem1", "appear_v1", "tend_v1", "likely_a2"]

[[rule]]
id = "substance.hedge-adverb"
kind = "words"
match = "surface"
severity = "suggestion"
message = "Hedge '{match}'; say how sure you are, or why."
words = [
  "arguably", "potentially", "conceivably", "presumably", "seemingly",
  "to some extent", "to a certain extent", "in some ways", "in a sense",
  "it could be argued", "it can be argued", "one could argue",
]

[[rule]]
id = "substance.stacked-hedge"
kind = "regex"
severity = "warning"
message = "Stacked hedges ('{match}'): one is enough."
description = "A modal verb followed by a hedging adverb, e.g. 'may potentially', 'could possibly'."
pattern = "(?i)\\b(?:may|might|could|can)\\s+(?:potentially|possibly|perhaps|conceivably|arguably)\\b"

[[rule]]
id = "substance.weasel"
kind = "regex"
severity = "warning"
message = "Vague attribution ('{match}'): who, and where? Cite the source."
description = "Claims attributed to unnamed studies, experts or people. Sentences with a citation (a link, a bracketed number, 'et al.' or a parenthesized year) are skipped."
pattern = "(?i)\\b(?:(?:many |some |most )?(?:studies|research|researchers|experts|scientists|critics|observers|analysts|people)\\s+(?:have\\s+)?(?:show|shows|shown|suggest|suggests|suggested|say|says|said|believe|believes|agree|agrees|argue|argues|found|find|finds|note|notes)|it\\s+is\\s+(?:widely|generally|commonly|often)\\s+(?:believed|accepted|known|agreed|thought|said))\\b"
unless = "\\[\\d+\\]|https?://|\\bet al\\.|\\([^()]*\\b(?:1[89]|20)\\d\\d[a-z]?\\)"

[[rule]]
id = "substance.vague-quantity"
kind = "words"
match = "surface"
severity = "suggestion"
message = "Vague quantity '{match}'; give a number or an example."
words = [
  "a number of", "a wide range of", "a wide variety of", "a variety of",
  "a plethora of", "a myriad of", "myriad", "countless", "numerous",
  "a host of", "a multitude of",
]

[[rule]]
id = "substance.certainty"
kind = "words"
match = "surface"
severity = "suggestion"
message = "'{match}' asserts certainty instead of showing it; give the evidence."
words = [
  "clearly", "obviously", "undeniably", "unquestionably", "indisputably",
  "undoubtedly", "without a doubt", "it goes without saying", "of course",
  "needless to say",
]

[[rule]]
id = "substance.missing-comparand"
kind = "semantics"
check = "missing-comparand"
severity = "warning"
message = "Comparison without a comparand ('{match}'): better, faster or more than what?"
description = "A comparative whose standard of comparison is not expressed, found in the grammar's semantics (a comparison predicate with no second argument): 'this approach is better'."

[[rule]]
id = "substance.agentless-passive"
kind = "semantics"
check = "agentless-passive"
severity = "suggestion"
message = "Passive without an actor ('{match}'): who did it?"
description = "A passive verb whose actor is not expressed anywhere in the sentence, from the grammar's semantics: 'the report was written', but not 'the report was written by Kim'."

[[rule]]
id = "substance.bare-demonstrative"
kind = "semantics"
check = "bare-demonstrative"
severity = "suggestion"
message = "'{match}' on its own: say what it refers to ('this result', 'this change')."
description = "A sentence that opens with 'this' or 'that' as a whole noun phrase, from the grammar's semantics; the reader must work out what it points to."

[[rule]]
id = "substance.filler"
kind = "words"
match = "surface"
severity = "suggestion"
message = "'{match}' adds nothing to the sentence; cut it."
description = "Set phrases that carry no meaning: the sentence says the same without them."
words = [
  "it goes without saying that", "it goes without saying", "needless to say",
  "the fact of the matter is", "it should be noted that",
  "it is interesting to note that", "it's interesting to note that",
  "as we all know", "when all is said and done", "for all intents and purposes",
  "last but not least", "first and foremost", "each and every",
  "cannot be overstated", "can't be overstated", "it is clear that",
  "it is evident that", "there is no doubt that",
  "in a very real sense", "simply put", "to be honest", "at its core",
  "it is important to remember that", "it's important to remember that",
  "it is important to keep in mind that", "it's important to keep in mind that",
  "plays a key role", "plays an important role", "plays a vital role",
]
examples = [
  "Needless to say, the release was late.\n",
  "Testing plays a key role in quality.\n",
]
acceptable = [
  "The release was late.\n",
]

[[rule]]
id = "substance.platitude"
kind = "regex"
severity = "warning"
message = "Platitude ('{match}'): the sentence could end any text on any subject."
description = "Stock sentences that say nothing about the subject at hand."
pattern = "(?i)^\\W*(?:and\\s+|but\\s+|so\\s+)?(?:only time will tell|the possibilities are (?:endless|limitless)|the sky(?:'s|’s| is) the limit|the future is (?:bright|now|here)|(?:that|this) changes everything|the rest is history|it is what it is|change is the only constant|the only constant is change|knowledge is power|time is money|communication is key|teamwork makes the dream work|every journey begins with a single step)\\W*$"
examples = [
  "We shipped the new release. Only time will tell.\n",
]
acceptable = [
  "Time will tell us whether the cache helps; we measure it next week.\n",
]

[[rule]]
id = "substance.vacuous"
kind = "semantics"
check = "vacuous"
severity = "suggestion"
message = "This sentence is made of abstractions ({detail}); say something a reader could check or act on."
description = "A sentence whose content words, from the grammar's semantics, are all or nearly all abstractions with no content of their own (future, change, success, potential, embrace, unlock, ...), with no name or number: 'The future belongs to those who embrace change.'"
examples = [
  "The future belongs to those who embrace change.\n",
]
acceptable = [
  "The release adds a cache that halves the build time.\n",
]

[[rule]]
id = "substance.aphorism"
kind = "semantics"
check = "aphorism"
severity = "suggestion"
message = "Aphorism ('{match}'): a maxim in place of a point; say what it means here."
description = "A short present-tense statement whose subject is a bare singular noun with nothing modifying it, from the grammar's semantics: 'Clarity beats complexity.', 'Consistency builds trust.'"
examples = [
  "Clarity beats complexity.\n",
]
acceptable = [
  "The cache beats the database by a factor of ten.\n",
]

[[rule]]
id = "substance.restatement"
kind = "semantics"
check = "restatement"
severity = "suggestion"
message = "This sentence restates an earlier one ('{detail}...'); cut it or say something new."
description = "A sentence at least four fifths of whose content words (at least four, from the grammar's semantics) one earlier sentence of the document already has: repackaging instead of advancing, as in a summary that repeats the introduction."
examples = [
  "The new cache reduces build times for large projects. It also adds a lock file.\n\nIn short, the new cache reduces build times for large projects.\n",
]
acceptable = [
  "The new cache reduces build times for large projects. The old cache stored every artifact on disk.\n",
]
