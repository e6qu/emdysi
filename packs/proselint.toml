message = "''{match}'' is hyperbolic."
severity = "suggestion"
source = "https://github.com/amperser/proselint (typography.punctuation.hyperbole); data/proselint/checks/typography/punctuation.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\w*(?:!|\\?){2,}"
acceptable = ["Smoke phrase with nothing flagged.\n", "This is good. Only one space each time. Every time.\n", "A cat can sleep 20.5 hours a day.\n", "I asked the Prof. what to do\n", "Sally sells seashells and they were too expensive!\n", "Why does Sally sell such expensive seashells?\n"]

[[rule]]
id = "proselint.typography-symbols-ellipsis"
kind = "regex"
message = "'...' is an approximation, use the ellipsis symbol '…'."
severity = "suggestion"
source = "https://github.com/amperser/proselint (typography.symbols.ellipsis); data/proselint/checks/typography/symbols.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\.\\.\\."
acceptable = ["Smoke phrase with nothing flagged.\n", "This is “a sentence”. Look at it.\n", "“This should produce no error”, he said.\n", "A 'singular' should not, though.\n"]

[[rule]]
id = "proselint.typography-symbols-copyright"
