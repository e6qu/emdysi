[[rule]]
id = "proselint.typography-symbols-sentence-spacing"
kind = "regex"
message = "More than two spaces after the period; use 1 or 2."
severity = "suggestion"
source = "https://github.com/amperser/proselint (typography.symbols.sentence_spacing); data/proselint/checks/typography/symbols.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\. {3}"
acceptable = ["Smoke phrase with nothing flagged.\n", "This is “a sentence”. Look at it.\n", "“This should produce no error”, he said.\n", "A 'singular' should not, though.\n"]

[[rule]]
id = "proselint.typography-symbols-multiplication"
kind = "regex"
message = "Use the multiplication symbol ×, not the letter x."
severity = "suggestion"
source = "https://github.com/amperser/proselint (typography.symbols.multiplication); data/proselint/checks/typography/symbols.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\d+ ?x ?\\d+"
acceptable = ["Smoke phrase with nothing flagged.\n", "This is “a sentence”. Look at it.\n", "“This should produce no error”, he said.\n", "A 'singular' should not, though.\n"]

[[rule]]
id = "proselint.typography-symbols-curly-quotes"
kind = "regex"
message = "Use curly quotes “”, not straight quotes \"\"."
severity = "suggestion"
source = "https://github.com/amperser/proselint (typography.symbols.curly_quotes); data/proselint/checks/typography/symbols.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\\"[\\w\\s\\d]+\\\""
acceptable = ["Smoke phrase with nothing flagged.\n", "This is “a sentence”. Look at it.\n", "“This should produce no error”, he said.\n", "A 'singular' should not, though.\n"]

[[rule]]
id = "proselint.weasel-words-very"
kind = "regex"
message = "Substitute 'damn' every time you're inclined to write 'very'; your editor will delete it and the writing will be just as it should be."
severity = "suggestion"
source = "https://github.com/amperser/proselint (weasel_words.very); data/proselint/checks/weasel_words.py"
license = "proselint (BSD-3-Clause, Copyright (c) 2014-2015 Jordan Suchow, Michael Pacer and Lara A. Ross); portions from After the Deadline (GPL); see data/proselint/SOURCE.md."
pattern = "(?i)\\bvery(?! well)\\b"
examples = ["We saw very in the draft.\n"]
acceptable = ["Smoke phrase with nothing flagged.\n", "Very well, Headmaster, thank you.\n", "The discovery and development of new approaches.\n"]
