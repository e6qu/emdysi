[pack]
name = "core"
description = "Spelling and grammaticality, from the English Resource Grammar's lexicon and rules. Every rule here claims an error, so each reports only what the grammar can establish: a complete search that found no analysis, an error every best analysis of the grammar-error variant names, a word one edit from a known word."

[[rule]]
id = "core.spelling"
kind = "spelling"
severity = "warning"
min_length = 4
message = "Unknown word '{match}'.{suggestion}"
description = "Lower-case words that neither the grammar's lexicon nor its inflection rules account for. Names, acronyms, numbers and inline code are skipped. A fix is applied only when exactly one known word is one edit away."

[[rule]]
id = "core.grammar-errors"
kind = "grammar-errors"
severity = "warning"
message = "{feedback}"
description = "Grammatical errors named by the grammar-error variant of the English Resource Grammar (its mal-rules and robust lexical entries): subject-verb agreement, wrong verb forms, missing articles, a/an, plural compounds and more. Only sentences without a strict analysis are re-parsed."
examples = [
  "The results was clear.\n",
  "Our users has asked for this feature.\n",
  "They doesn't know.\n",
  "He don't know.\n",
  "I buyed a car.\n",
]
acceptable = [
  "The results were clear.\n",
  "They don't know.\n",
  "Well, much good may it do them!\n",
  "I bought a car.\n",
]

[[rule]]
id = "core.consistency"
kind = "consistency"
severity = "warning"
message = "'{match}' is {variety} spelling, but the text mostly uses {dominant} spelling: '{replacement}'."
description = "American and British spellings (or British -ise and -ize) mixed in one document. Either variety is fine on its own; the one used most wins. Set `prefer` (\"us\" or \"gb\") and `prefer_suffix` (\"ise\" or \"ize\") in your own pack to fix the choice."

[[rule]]
id = "core.articles"
kind = "articles"
severity = "warning"
message = "Use '{fix}' before '{word}'."
description = "'a' before a vowel sound or 'an' before a consonant sound, where the spelling settles the sound: words starting with h, x or uni-, acronyms, letters and numbers are skipped, and the article must be a determiner in the best analysis."
examples = ["The field is a alpha-level field.\n"]

[[rule]]
id = "core.repeated-word"
kind = "repeated-word"
severity = "warning"
message = "Repeated word: '{match}'."
description = "A function word written twice in a row ('the the', 'to to', 'are are'), in a sentence the grammar has no full analysis for: English allows some doublings ('that that is is', 'Will Will will', 'had had'). A run of three or more is taken as deliberate ('can can can')."
examples = ["It can be modified and and removed at any time.\n"]

[[rule]]
id = "core.double-article"
kind = "repeated-word"
articles = true
severity = "warning"
message = "Two articles in a row: '{match}'."
description = "Two different articles in a row ('a the', 'the an'), in lower case, in a sentence the grammar has no full analysis for."
examples = ["Events such as a the last process ending.\n"]
