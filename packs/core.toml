[pack]
name = "core"
description = "Spelling and grammaticality, from the English Resource Grammar's lexicon and rules."

[[rule]]
id = "core.spelling"
kind = "spelling"
severity = "warning"
min_length = 3
message = "Unknown word '{match}'.{suggestion}"
description = "Lower-case words that neither the grammar's lexicon nor its inflection rules account for. Names, acronyms, numbers and inline code are skipped. A fix is applied only when exactly one known word is one edit away."

[[rule]]
id = "core.grammar"
kind = "grammar"
severity = "suggestion"
message = "Possibly ungrammatical: {reason}."
description = "Sentences for which the grammar finds no analysis, or only a fragment or informal one. Long sentences may also time out."
