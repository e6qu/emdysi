[pack]
name = "core"
# Errors are errors in quotations too.
quoted = true
description = "Spelling and grammaticality, from the English Resource Grammar's lexicon and rules. Every rule here claims an error, so each reports only what the grammar can establish: a complete search that found no analysis, an error every best analysis of the grammar-error variant names, a word one edit from a known word, or a few constructions wrong in any context ('allows to map')."

[[rule]]
id = "core.spelling"
kind = "spelling"
severity = "warning"
min_length = 4
# Technical vocabulary and tool names common in software writing, and a few
# English words, that the bundled word lists (SCOWL, cspell) leave out.
ignore = [
  "alia", "curtsey", "curtseyed", "curtseys", "async", "cadvisor", "devs", "distinguisher", "distroless", "gsoc", "hackmd", "iirc",
  "implementor", "implementors", "libc", "nftables", "nightlies", "rootfs", "shoutout",
  "shoutouts", "subnet", "subnets", "subtrait", "subtraits", "supertrait",
  "supertraits", "writeable", "zulip",
]
message = "Unknown word '{match}'.{suggestion}"
description = "Lower-case words that neither the grammar's lexicon nor its inflection rules account for. Names, mentions (@name), numbers and inline code are skipped. A fix is applied only when exactly one known word is one edit away."
acceptable = [
  "Thanks to @epage for the review.\n",
]

[[rule]]
id = "core.grammar-fix"
kind = "assisted-grammar"
severity = "warning"
threshold = 0.8
screen = 0.5
screen_surprise = 3.0
message = "'{match}' does not fit here: the grammar accepts '{replacement}' instead, and the model prefers it ({percent}%)."
description = "With a local decision model (--model, --server, --lm or EMDYSI_LM): a sentence with no full analysis is corrected by changing one word to another form of itself (jump to jumps); the corrections the strict grammar accepts are shown to the model with the original, and one is reported when the model prefers it with probability 0.8 or more. A sentence the grammar accepts is corrected the same way, and also by changing or inserting a function word or dropping a doubled one, when one of its words surprises the model where it stands 3 nats or more beyond the word alone (a model that scores text), or else when the model, asked first, doubts it (probability 0.5 or more that it is not correct English). Without a model, nothing. Catches errors the grammar alone cannot claim, such as 'The quick brown fox jump over the wall.', which it can also read as a noun phrase (a jump)."

[[rule]]
id = "core.grammar-errors"
kind = "grammar-errors"
severity = "warning"
message = "{feedback}"
description = "Grammatical errors named by the grammar-error variant of the English Resource Grammar (its mal-rules and robust lexical entries): subject-verb agreement, wrong verb forms, missing articles, a/an, plural compounds and more. Only sentences without a strict analysis are re-parsed."
examples = [
  "The results was clear.\n",
  "Our users has asked for this feature.\n",
  "They doesn't know.\n",
  "He don't know.\n",
  "I buyed a car.\n",
  "We have ate lunch.\n",
]
acceptable = [
  "The results were clear.\n",
  "They don't know.\n",
  "Well, much good may it do them!\n",
  "I bought a car.\n",
  "She has written a letter.\n",
  "How he lived I know not.\n",
]

[[rule]]
id = "core.consistency"
kind = "consistency"
severity = "warning"
message = "'{match}' is {variety} spelling, but the text mostly uses {dominant} spelling: '{replacement}'."
description = "American and British spellings (or British -ise and -ize) mixed in one document. Either variety is fine on its own; the one used most wins. Set `prefer` (\"us\" or \"gb\") and `prefer_suffix` (\"ise\" or \"ize\") in your own pack to fix the choice."

[[rule]]
id = "core.articles"
kind = "articles"
severity = "warning"
message = "Use '{fix}' before '{word}'."
description = "'a' before a vowel sound or 'an' before a consonant sound, where the spelling settles the sound: words starting with h, x or uni-, acronyms, letters and numbers are skipped, and the article must be a determiner in the best analysis."
examples = ["The field is a alpha-level field.\n"]

[[rule]]
id = "core.repeated-word"
kind = "repeated-word"
severity = "warning"
message = "Repeated word: '{match}'."
description = "A function word written twice in a row ('the the', 'to to', 'are are'), in a sentence the grammar has no full analysis for: English allows some doublings ('that that is is', 'Will Will will', 'had had'). Words that are only ever doubled by mistake (articles, 'to', 'of', 'for', 'with', 'from', 'into', 'and', 'or', 'as', 'at', 'by', possessives) are reported whatever the analysis. A run of three or more is taken as deliberate ('can can can')."
examples = ["It can be modified and and removed at any time.\n"]

[[rule]]
id = "core.allow-to"
kind = "regex"
severity = "warning"
message = "'{match}' needs someone to allow: 'allows you to …', 'allows … to …', or 'allows …ing'."
pattern = "(?i)\\b(?:allows|allow|allowing|enables|enable|enabling)\\s+to(?=\\s+[a-z])"
description = "'Allow' and 'enable' take an object before 'to' ('allows you to map users', not 'allows to map users'). The passive ('is allowed to') is fine, and 'permit' is left out (a permit to build). All four such errors of the real-error corpus; once in the development sets, also an error."
examples = [
  "User namespaces is a Linux feature that allows to map users in the container.\n",
  "Defaulting enables to specify default values.\n",
]
acceptable = [
  "User namespaces is a Linux feature that allows you to map users in the container.\n",
  "Pods are allowed to map users.\n",
  "A permit to build is required.\n",
]

[[rule]]
id = "core.fore-for"
kind = "regex"
severity = "warning"
message = "'{match}' should be 'for' here."
pattern = "\\b(?<m>(?<f>[Ff])ore)(?=\\s+(?:more|example|instance|details|further|information)\\b)"
replace = "${f}or"
description = "'Fore' typed for 'for' before 'more', 'example', 'instance', 'details', 'further' or 'information': the grammar accepts 'fore' as a word ('to the fore'). Once in the real-error corpus, never in the development sets."
examples = ["Fore more details on etcd maintenance, see the guide.\n"]
acceptable = [
  "For more details on etcd maintenance, see the guide.\n",
  "The issue came to the fore.\n",
]

[[rule]]
id = "core.adjective-for-adverb-opening"
kind = "regex"
severity = "warning"
message = "'{match},' opens the sentence as an adverb: '{match}ly,'."
pattern = "^(?<m>Additional|Consequent|Subsequent),"
replace = "${m}ly"
description = "A sentence that opens with 'Additional,' (or 'Consequent,', 'Subsequent,') means the adverb. Once in the real-error corpus, never in the development sets."
examples = ["Additional, we are starting a new initiative.\n"]
acceptable = [
  "Additionally, we are starting a new initiative.\n",
  "Additional nodes join later.\n",
]

[[rule]]
id = "core.following-article"
kind = "regex"
severity = "warning"
message = "'{match}' needs 'the' before it when it introduces what follows: 'the following'."
pattern = "(?<!\\b[Tt]he\\s)(?<!\\b[Tt]hese\\s)(?<!\\b[Aa]\\s)(?<!\\b[Aa]ll\\s)(?<!\\b[Oo]f\\s)(?<=\\w\\s)\\b(?<m>following)\\s+(?!(?:the|these|this|those|that|a|an|your|our|its|their|my|his|her|them|it|him|us|me|you|some|any|each|every|all|steps|instructions)\\b)[a-z][a-z -]{0,40}:\\s*$"
replace = "the following"
description = "'Following' that introduces a list ('contain following names:', 'executes following actions:') needs 'the'. A gerund with its object ('by following these steps:') is left alone. Three times in the real-error corpus, never in the development sets."
examples = [
  "This certificate should contain following alternative names:\n",
  "As soon as the control plane is available, kubeadm executes following actions:\n",
]
acceptable = [
  "This certificate should contain the following alternative names:\n",
  "Install it by following these steps:\n",
  "Run the following commands:\n",
  "Following the release, we fixed it.\n",
]

[[rule]]
id = "core.chose-choose"
kind = "regex"
severity = "warning"
message = "'Chose' is past tense: an instruction is 'Choose'."
pattern = "^(?<m>Chose)\\s+(?=(?:one|a|an|the|which|between|from|your|any)\\b)"
replace = "Choose"
description = "A sentence or list item that opens with 'Chose' and its object is an instruction: 'Choose'. Once in the real-error corpus, never in the development sets."
examples = ["Chose one of your nodes, and add a label to it.\n"]
acceptable = [
  "Choose one of your nodes, and add a label to it.\n",
  "She chose one of the nodes.\n",
]

[[rule]]
id = "core.the-both"
kind = "regex"
severity = "warning"
message = "'{match}': 'both' takes no article ('both old and new')."
pattern = "\\b(?<m>[Tt]he both)\\b(?!\\s+of\\b)"
replace = "both"
description = "'The both' before what it joins ('the both old and new CA') is a leftover of an edit; the informal 'the both of us' is left alone. Once in the real-error corpus, never in the development sets."
examples = ["Append the both old and new CA to the file.\n"]
acceptable = [
  "Append both old and new CA to the file.\n",
  "It is the both of them.\n",
]

[[rule]]
id = "core.be-have"
kind = "regex"
severity = "warning"
message = "'{match}': one of the two verbs is left over from an edit."
pattern = "\\b(?<m>be have)\\b"
description = "'Be have' ('will be have one of the following values') is never English: one verb is left over from an edit. Once in the real-error corpus, never in the development sets."
examples = ["The label will be have one of the following values.\n"]
acceptable = ["The label will have one of the following values.\n", "Children should behave.\n"]

[[rule]]
id = "core.his-this"
kind = "regex"
severity = "warning"
message = "A sentence opens with 'his': did you mean 'This'?"
pattern = "(?:^|[.!?]\\s+)(?<m>his)\\s+(?=(?:means|is|was|will|can|allows|lets|makes)\\b)"
replace = "This"
description = "A sentence that opens with lower-case 'his' and a verb ('his means that') has lost the T of 'This'. Once in the real-error corpus, never in the development sets."
examples = ["The default is an empty list. his means that every address is used.\n"]
acceptable = ["This means that every address is used.\n", "He said his means were small.\n"]

[[rule]]
id = "core.is-verb"
kind = "regex"
severity = "warning"
message = "'{match}': 'is' before a verb that already agrees with its subject is left over from an edit."
pattern = "\\b(?<m>is)\\s+(?=(?:works|supports|provides|allows|requires|uses|returns)\\s+(?:like|the|a|an|for|to|with|it|you|this|that)\\b)"
description = "'Is' before a verb in the third person ('is works like type annotations') is left over from an edit; a noun reading ('is works of art') is avoided by what must follow. Once in the real-error corpus, never in the development sets."
examples = ["A type annotation for `self` is works like type annotations for other parameters.\n"]
acceptable = [
  "A type annotation for `self` works like type annotations for other parameters.\n",
  "The collection is works of art.\n",
]

[[rule]]
id = "core.double-article"
kind = "repeated-word"
articles = true
severity = "warning"
message = "Two articles in a row: '{match}'."
description = "Two different articles in a row ('a the', 'the an'), in lower case, in a sentence the grammar has no full analysis for."
examples = ["Events such as a the last process ending.\n"]
