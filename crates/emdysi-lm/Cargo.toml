[package]
name = "emdysi-lm"
description = "Pluggable local language models for emdysi: GGUF through llama.cpp, any OpenAI-compatible server (llama-server, MLX, Ollama, LM Studio), and a decision engine that returns typed probabilities instead of text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["http"]
# A local model through llama.cpp (builds llama.cpp from source; needs
# cmake and a C++ compiler).
llama = ["dep:llama-cpp-2"]
# A model served over HTTP with the OpenAI-compatible API: MLX
# (`mlx_lm.server`), LM Studio, Ollama, llama.cpp's `llama-server`, ...
http = ["dep:ureq", "dep:serde_json"]

[dependencies]
llama-cpp-2 = { version = "0.1.158", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", default-features = false, optional = true }

[lints]
workspace = true
