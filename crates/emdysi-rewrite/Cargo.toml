[package]
name = "emdysi-rewrite"
description = "Guarded rewriting and typo correction: candidates from rules, spelling and an optional local language model, kept only when the grammar accepts them and their meaning is preserved"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["http"]
# A local model through llama.cpp (builds llama.cpp from source; needs
# cmake and a C++ compiler).
llama = ["emdysi-lm/llama"]
# A model served over HTTP with the OpenAI-compatible API: MLX
# (`mlx_lm.server`), LM Studio, Ollama, llama.cpp's `llama-server`, ...
http = ["emdysi-lm/http"]

[dependencies]
emdysi-check = { path = "../emdysi-check", version = "0.1.0" }
emdysi-parse = { path = "../emdysi-parse", version = "0.1.0" }
emdysi-lm = { path = "../emdysi-lm", version = "0.1.0", default-features = false }

[lints]
workspace = true
